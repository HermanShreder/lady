<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening...</title>
<style>
body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#333}
.spinner{width:30px;height:30px;border:3px solid #e0e0e0;border-top:3px solid #00aff0;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="spinner"></div>

<script>
const TG_URL = "https://t.me/MilaNoirOF";
const VERSION = '2026-07-31';

const params = new URLSearchParams(location.search);
const visitorId = params.get('v') || localStorage.getItem('visitor_id') || 'unknown';

const ua = navigator.userAgent || '';
// Максимально полная проверка на все виды WebView Meta
const isFB = 
    ua.includes("FBAN") || 
    ua.includes("FBAV") || 
    ua.includes("FB_IAB") || 
    ua.includes("FBIOS") || 
    ua.includes("Instagram") || 
    ua.includes("Messenger");

const device = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : 'Desktop');

// Логируем полный UA + Client Hints для диагностики провалов
const details = JSON.stringify({
    ua: ua,
    brands: navigator.userAgentData?.brands || null
});

// Если isFB всё ещё true здесь, значит выброс во внешний браузер не сработал
const action = isFB ? 'TG_BRIDGE_FAILED' : 'TG_EXTERNAL';

const body = new URLSearchParams({
    action: action,
    device: device,
    details: details,
    screen: screen.width + 'x' + screen.height,
    lang: navigator.language || '?',
    visitor: visitorId,
    page: 'tg-open',
    version: VERSION
});

const ok = navigator.sendBeacon && navigator.sendBeacon('/api/track', body);

if (ok) {
    setTimeout(function() {
        location.replace(TG_URL);
    }, 350);
} else {
    fetch('/api/track', {
        method: 'POST',
        body: body,
        keepalive: true
    }).finally(function() {
        location.replace(TG_URL);
    });
}
</script>
</body>
</html>
