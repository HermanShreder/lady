<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening...</title>
<style>
body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#333}
.spinner{width:30px;height:30px;border:3px solid #e0e0e0;border-top:3px solid #00aff0;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="spinner"></div>

<a id="openBtn"
   href="#"
   style="margin-top:30px;
          padding:16px 28px;
          background:#0088cc;
          color:#fff;
          text-decoration:none;
          border-radius:10px;
          font-size:18px;
          font-weight:600;">
    Open Telegram
</a>

<script>
const TG_URL = "https://t.me/MilaNoirOF";
const VERSION = '2026-07-31-TGOPEN';

const params = new URLSearchParams(location.search);
const visitorId = params.get('v') || localStorage.getItem('visitor_id') || 'unknown';

const ua = navigator.userAgent || '';
const device = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : 'Desktop');

// Определяем Meta WebView ТОЛЬКО по маркерам User-Agent
const hasFBUA = 
    ua.includes("FBAN") || 
    ua.includes("FBAV") || 
    ua.includes("FB_IAB") || 
    ua.includes("Instagram") || 
    ua.includes("Messenger");

const hasAndroidWebViewBrand = 
    navigator.userAgentData?.brands?.some(b => b.brand === "Android WebView");

function trackTG(action, detail) {
    const body = new URLSearchParams({
        action: action,
        device: device,
        details: detail || '',
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language || '?',
        visitor: visitorId,
        page: 'tg-open',
        version: VERSION,
        browser: hasFBUA ? 'meta_webview' : (device === 'iOS' ? 'ios' : 'external_chrome')
    });

    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', body);
    } else {
        fetch('/api/track', { method: 'POST', body: body, keepalive: true }).catch(function(){});
    }
}

// 1. Детальное логирование окружения при загрузке
trackTG('TG_PAGE_OPEN', JSON.stringify({
    ua: navigator.userAgent,
    brands: navigator.userAgentData?.brands || null,
    vendor: navigator.vendor,
    referrer: document.referrer,
    platform: navigator.platform,
    url: location.href,
    visibility: document.visibilityState,
    hasFBUA: hasFBUA,
    hasAndroidWebViewBrand: hasAndroidWebViewBrand
}));

// 2. Логируем показ кнопки
trackTG('SHOW_MANUAL_BUTTON');

// 3. Логика кнопки
const btn = document.getElementById('openBtn');

btn.onclick = function (e) {
    e.preventDefault();

    trackTG('MANUAL_BUTTON_CLICK');
    trackTG('TG_OPEN_ATTEMPT');
    trackTG('TG_SCHEME_START_MANUAL');

    // Открываем Telegram по пользовательскому действию
    location.href = "tg://resolve?domain=MilaNoirOF";

    setTimeout(function () {
        if (document.visibilityState === 'visible') {
            trackTG('TG_SCHEME_FAILED_MANUAL');
            location.replace(TG_URL);
        }
    }, 1200);
};
</script>
</body>
</html>
