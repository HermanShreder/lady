<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Continue</title>

<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f(fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=true;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window,document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init','2127136807835684');
fbq('track', 'PageView');
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fff;color:#333;text-align:center;padding:20px}
.title{font-size:18px;font-weight:600;margin-bottom:24px;color:#333}
.btn{display:inline-block;padding:16px 32px;background:#00aff0;color:#fff;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 12px rgba(0,175,240,0.3);transition:transform 0.1s}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>

<div class="title">Tap to open Chat</div>
<!-- Ссылка обновлена на чат с текстом -->
<a id="openBtn" class="btn" href="#">Open Chat</a>

<script>
let visitorId = localStorage.getItem('visitor_id');
if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem('visitor_id', visitorId);
}

const VERSION = '2026-08-03-BRIDGE-CHAT-MSG';

// --- КОНФИГУРАЦИЯ ---
const TG_USERNAME = 'frgnoo';
const PREFILL_MSG = 'Здравствуйте я из рекламы фб,меня интересует онлайн заработок';
const encodedMsg = encodeURIComponent(PREFILL_MSG);

// Универсальная ссылка, которая открывает чат и вставляет текст (работает на iOS и Android)
const TG_URL_WITH_TEXT = `https://t.me/${TG_USERNAME}?text=${encodedMsg}`;

// Устанавливаем правильную ссылку в кнопку сразу
document.getElementById('openBtn').href = TG_URL_WITH_TEXT;

var ua = navigator.userAgent || '';
var device = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : 'Desktop');

// ОПРЕДЕЛЕНИЕ FB/INSTAGRAM BROWSER
var isFB = false;
if (/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|wv/i.test(ua)) {
    isFB = true;
}
if (navigator.userAgentData && navigator.userAgentData.brands) {
    if (navigator.userAgentData.brands.some(b => b.brand === "Android WebView")) {
        isFB = true;
    }
}

function trackTG(action, details) {
    var d = new URLSearchParams({
        action: action,
        device: device,
        details: details || '',
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language || '?',
        visitor: visitorId,
        page: 'bridge_direct_chat',
        version: VERSION,
        browser: isFB ? 'inapp' : 'external'
    });

    if (navigator.sendBeacon) navigator.sendBeacon('/api/track', d);
    else fetch('/api/track', { method: 'POST', body: d, keepalive: true }).catch(function(){});
}

// Логируем открытие страницы
trackTG('BRIDGE_OPEN');

function executeRedirect() {
    trackTG('REDIRECT_TRIGGERED');

    if (device === 'Android') {
        if (isFB) {
            // ANDROID IN-APP: Выброс в Chrome, который передаст ссылку с текстом в Telegram
            trackTG('ANDROID_FB_INTENT_ESCAPE');
            
            const intent = "intent://" + 
                TG_URL_WITH_TEXT.replace(/^https?:\/\//, "") + 
                "#Intent;scheme=https;package=com.android.chrome;" +
                "S.browser_fallback_url=" + encodeURIComponent(TG_URL_WITH_TEXT) + ";end";
            
            window.location.href = intent;

            setTimeout(function() {
                if (document.visibilityState === 'visible') {
                    trackTG('INTENT_FAILED_FALLBACK_WEB');
                    window.location.href = TG_URL_WITH_TEXT;
                }
            }, 2000);

        } else {
            // ANDROID EXTERNAL: Прямой переход по ссылке с текстом
            trackTG('ANDROID_EXTERNAL_SCHEME');
            window.location.href = TG_URL_WITH_TEXT;
        }

    } else if (device === 'iOS') {
        // iOS: Ссылка https://t.me/...?text=... идеально открывает приложение с сообщением
        trackTG('IOS_SCHEME_ATTEMPT');
        window.location.href = TG_URL_WITH_TEXT;
        
        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                trackTG('IOS_SCHEME_FAILED_WEB');
                window.location.href = TG_URL_WITH_TEXT;
            }
        }, 1500);

    } else {
        // Desktop
        trackTG('DESKTOP_WEB_REDIRECT');
        window.location.replace(TG_URL_WITH_TEXT);
    }
}

// АВТОЗАПУСК УДАЛЕН. Редирект сработает ТОЛЬКО по клику.

// Обработка клика по кнопке
document.getElementById('openBtn').addEventListener('click', function(e) {
    // Мы НЕ делаем e.preventDefault(), чтобы браузер максимально естественно обработал клик по ссылке <a>,
    // но мы всё равно успеваем отправить аналитику и Pixel
    
    if (typeof fbq === 'function') {
        fbq('track', 'Lead', { content_name: 'bridge_chat_click' });
    }
    
    trackTG('MANUAL_CLICK_REDIRECT');
    
    // Запускаем нашу проверенную логику редиректа
    executeRedirect();
});

</script>
</body>
</html>
