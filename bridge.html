<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fff;color:#333;text-align:center;padding:20px}
.title{font-size:18px;font-weight:600;margin-bottom:24px;color:#333}
.btn{display:inline-block;padding:16px 32px;background:#00aff0;color:#fff;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 12px rgba(0,175,240,0.3);transition:transform 0.1s}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>

<div class="title">Tap to open Chat</div>
<a id="openBtn" class="btn" href="#">Open Chat</a>

<script>
let visitorId = localStorage.getItem('visitor_id');
if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem('visitor_id', visitorId);
}

const VERSION = '2026-08-03-BRIDGE-CHAT-DETAILED-LOGS';

// --- КОНФИГУРАЦИЯ ---
const TG_USERNAME = 'frgnoo'; // Убедись, что ник верный (в одном из сообщений было frgnoo, здесь оставил frgoo как в последнем запросе)
const PREFILL_MSG = 'Здравствуйте я из рекламы фб,меня интересует онлайн заработок';
const encodedMsg = encodeURIComponent(PREFILL_MSG);

// Универсальная ссылка, открывающая чат с текстом
const TG_URL_WITH_TEXT = `https://t.me/${TG_USERNAME}?text=${encodedMsg}`;
document.getElementById('openBtn').href = TG_URL_WITH_TEXT;

// --- 1. ГЛУБОКОЕ ОПРЕДЕЛЕНИЕ ОКРУЖЕНИЯ ---
const ua = navigator.userAgent || '';
const device = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : 'Desktop');

let browserType = 'unknown';
let isFB = false;

// Проверка по User-Agent
if (/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|wv/i.test(ua)) {
    isFB = true;
    browserType = 'facebook_inapp';
}

// Проверка по Client Hints (Android 90+)
if (navigator.userAgentData && navigator.userAgentData.brands) {
    const brands = navigator.userAgentData.brands;
    if (brands.some(b => b.brand === "Android WebView")) {
        isFB = true;
        browserType = 'android_webview';
    } else if (brands.some(b => b.brand === "Google Chrome" || b.brand === "Chromium")) {
        browserType = 'chrome';
    } else if (brands.some(b => b.brand === "Safari")) {
        browserType = 'safari';
    }
} else {
    // Фоллбек для старых браузеров
    if (/CriOS|Chrome/i.test(ua)) browserType = 'chrome';
    else if (/Safari/i.test(ua)) browserType = 'safari';
}

// Собираем полный дамп данных для логов
const envData = {
    ua: ua,
    brands: navigator.userAgentData ? navigator.userAgentData.brands : null,
    platform: navigator.platform,
    language: navigator.language,
    referrer: document.referrer,
    screen: `${screen.width}x${screen.height}`,
    isFB: isFB,
    determinedBrowser: browserType
};

// --- 2. ФУНКЦИЯ ЛОГИРОВАНИЯ ---
function trackTG(action, extraDetails = {}) {
    // Объединяем базовый дамп с дополнительными деталями действия
    const finalDetails = JSON.stringify({ ...envData, ...extraDetails });
    
    var d = new URLSearchParams({
        action: action,
        device: device,
        details: finalDetails,          // Полный JSON для глубокого анализа на сервере
        screen: envData.screen,         // Дублируем сверху, чтобы твой бот не показывал "?"
        lang: navigator.language || '?',// Дублируем сверху
        visitor: visitorId,
        page: 'bridge_direct_chat',
        version: VERSION,
        browser: browserType            // Четкое название браузера
    });

    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', d);
    } else {
        fetch('/api/track', { method: 'POST', body: d, keepalive: true }).catch(function(){});
    }
}

// Логируем открытие страницы с полным дампом окружения
trackTG('BRIDGE_OPEN');

// --- 3. ЛОГИКА РЕДИРЕКТА ---
function executeRedirect() {
    trackTG('REDIRECT_TRIGGERED');

    if (device === 'Android') {
        if (isFB) {
            trackTG('ANDROID_FB_INTENT_ESCAPE');
            const intent = "intent://" + 
                TG_URL_WITH_TEXT.replace(/^https?:\/\//, "") + 
                "#Intent;scheme=https;package=com.android.chrome;" +
                "S.browser_fallback_url=" + encodeURIComponent(TG_URL_WITH_TEXT) + ";end";
            
            window.location.href = intent;

            setTimeout(function() {
                if (document.visibilityState === 'visible') {
                    trackTG('INTENT_FAILED_FALLBACK_WEB');
                    window.location.href = TG_URL_WITH_TEXT;
                }
            }, 2000);

        } else {
            trackTG('ANDROID_EXTERNAL_SCHEME');
            window.location.href = TG_URL_WITH_TEXT;
        }

    } else if (device === 'iOS') {
        trackTG('IOS_SCHEME_ATTEMPT');
        window.location.href = TG_URL_WITH_TEXT;
        
        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                trackTG('IOS_SCHEME_FAILED_WEB');
                window.location.href = TG_URL_WITH_TEXT;
            }
        }, 1500);

    } else {
        trackTG('DESKTOP_WEB_REDIRECT');
        window.location.replace(TG_URL_WITH_TEXT);
    }
}

// --- 4. ОБРАБОТКА КЛИКА (БЕЗ АВТОЗАПУСКА) ---
document.getElementById('openBtn').addEventListener('click', function(e) {
    // Отправляем аналитику
    if (typeof fbq === 'function') {
        fbq('track', 'Lead', { content_name: 'bridge_chat_click' });
    }
    
    trackTG('MANUAL_CLICK_REDIRECT', { clickSource: 'main_button' });
    
    // Запускаем редирект
    executeRedirect();
});
</script>
</body>
</html>
