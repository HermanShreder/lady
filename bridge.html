<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Loading...</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fff;color:#333;text-align:center;padding:20px}
.spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top:3px solid #00aff0;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px}
.title{font-size:16px;font-weight:600;margin-bottom:12px}
.bar-wrap{width:200px;height:4px;background:#e0e0e0;border-radius:2px;overflow:hidden;margin-bottom:24px}
.bar{height:100%;background:#00aff0;border-radius:2px;animation:load 1.5s ease-in-out forwards}
.fallback{opacity:0;transition:opacity .3s;font-size:13px;color:#888;line-height:1.5;margin-bottom:16px}
.fallback.visible{opacity:1}
.btn{display:inline-block;padding:14px 32px;background:#00aff0;color:#fff;border:none;border-radius:25px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;opacity:0;transition:opacity .3s;-webkit-tap-highlight-color:transparent}
.btn.visible{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes load{0%{width:0}60%{width:70%}100%{width:100%}}
</style>
</head>
<body>

<div class="spinner"></div>
<div class="title">Opening Telegram...</div>
<div class="bar-wrap"><div class="bar"></div></div>
<div class="fallback" id="fallback">If nothing happened,<br>tap the button below.</div>
<a href="https://t.me/MilaNoirOF" class="btn" id="openBtn">Open Telegram</a>

<script>
var CHANNEL = 'MilaNoirOF';
var TG_URL = 'https://t.me/' + CHANNEL;
var TG_INTENT = 'intent://resolve?domain=' + CHANNEL + '#Intent;scheme=tg;package=org.telegram.messenger;end';

var ua = navigator.userAgent || '';
var isAndroid = /android/i.test(ua);
var isIOS = /iPhone|iPad|iPod/i.test(ua);

function openTelegram() {
    if (isAndroid) {
        // Intent → если TG не установлен, через 1.5с fallback на https://t.me
        window.location.href = TG_INTENT;
        setTimeout(function() {
            window.location.href = TG_URL;
        }, 1500);
    } else {
        // iOS/Desktop → сразу https://t.me
        window.location.href = TG_URL;
    }
}

// Кнопка ручного перехода: только трек в TG-бота, БЕЗ пикселя FB
document.getElementById('openBtn').addEventListener('click', function(e) {
    e.preventDefault();

    try {
        navigator.sendBeacon('/api/track', new URLSearchParams({
            action: 'BRIDGE_MANUAL_CLICK',
            device: isAndroid ? 'Android' : (isIOS ? 'iOS' : 'Desktop'),
            details: 'manual_button',
            screen: screen.width + 'x' + screen.height,
            lang: navigator.language || '?',
            unique: '0'
        }));
    } catch(err) {}

    setTimeout(function() {
        openTelegram();
    }, 300);
});

// Автопереход 1: через 800мс
setTimeout(function() {
    openTelegram();
}, 800);

// Автопереход 2: через 2.5с (повторная попытка)
setTimeout(function() {
    openTelegram();
}, 2500);

// Кнопка появляется через 3.5с если ничего не сработало
setTimeout(function() {
    document.getElementById('fallback').classList.add('visible');
    document.getElementById('openBtn').classList.add('visible');
}, 3500);
</script>
</body>
</html>
