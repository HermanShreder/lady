<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #fff;
    color: #333;
    text-align: center;
    padding: 20px;
}

.title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 24px;
    color: #333;
}

.btn {
    display: inline-block;
    padding: 16px 32px;
    background: #00aff0;
    color: #fff;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 4px 12px rgba(0,175,240,0.3);
    transition: transform 0.1s;
}

.btn:active {
    transform: scale(0.98);
}
</style>

</head>

<body>

<div class="title">Tap to continue in browser</div>

<a id="openBtn" class="btn">
    Open in Browser
</a>

<script>
let visitorId = localStorage.getItem('visitor_id');

if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);

    localStorage.setItem('visitor_id', visitorId);
}

const VERSION = '2026-08-01-BRIDGE-HUMAN-LOGS';

const EXTERNAL_URL = "/external.html?v=" + encodeURIComponent(visitorId);
const fullExternalUrl = location.origin + EXTERNAL_URL;

var ua = navigator.userAgent || '';

var device = /iPhone|iPad|iPod/i.test(ua)
        ? 'iOS'
        : (/Android/i.test(ua) ? 'Android' : 'Desktop');

var isFB =
    ua.includes("FBAN") ||
    ua.includes("FBAV") ||
    ua.includes("FB_IAB") ||
    ua.includes("FBIOS") ||
    ua.includes("Instagram") ||
    ua.includes("Messenger") ||
    ua.includes("wv");

function trackTG(action, details) {
    var d = new URLSearchParams({
        action: action,
        device: device,
        details: details || '',
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language || '?',
        visitor: visitorId,
        page: 'bridge',
        version: VERSION,
        browser: isFB ? 'inapp' : 'external'
    });

    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', d);
    } else {
        fetch('/api/track', {
            method: 'POST',
            body: d,
            keepalive: true
        }).catch(function(){});
    }
}

// ---------------------------------------------------------
// ОТСЛЕЖИВАНИЕ УСПЕШНОГО ВЫХОДА ИЗ FACEBOOK
// ---------------------------------------------------------

document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
        trackTG('ПЕРЕХОД_ВО_ВНЕШНИЙ_БРАУЗЕР_УСПЕШНЫЙ', 'Приложение свернулось в фон, открылся внешний браузер');
    }
});

// ---------------------------------------------------------

trackTG('ПРОКЛАДКА_ОТКРЫТА');

const openBtn = document.getElementById('openBtn');

// 1. Формируем правильный href
if (device === 'Android' && isFB) {
    const intentUrl = 
        'intent://' + 
        fullExternalUrl.replace(/^https?:\/\//, '') + 
        '#Intent;' +
        'scheme=https;' +
        'action=android.intent.action.VIEW;' +
        'category=android.intent.category.BROWSABLE;' +
        'package=com.android.chrome;' +
        'S.browser_fallback_url=' + encodeURIComponent(fullExternalUrl) + 
        ';end';
        
    openBtn.href = intentUrl;
} else {
    openBtn.href = fullExternalUrl;
}

// 2. ОБРАБОТЧИК КЛИКА
openBtn.addEventListener('click', function(e) {
    
    if (typeof fbq === 'function') {
        fbq('track', 'Lead', {
            content_name: 'bridge_click'
        });
    }

    trackTG('СОБЫТИЕ_ПИКСЕЛЯ_ОТПРАВЛЕНО');
    trackTG('КЛИК_ПО_ССЫЛКЕ');

    if (device === 'Android' && isFB) {
        
        trackTG('ПОПЫТКА_ОТКРЫТЬ_ВНЕШНИЙ_БРАУЗЕР', 'Метод: Android Intent');
        
        // Если WebView заблокировал интент и страница осталась висеть
        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                trackTG('НЕ_УДАЛОСЬ_ОТКРЫТЬ_ВНЕШНИЙ_БРАУЗЕР', 'Причина: In-App браузер заблокировал Intent. ПЕРЕВОД НА ФОЛЛ БЕК (открытие внутри FB)');
                window.location.href = fullExternalUrl;
            }
        }, 2000);
        
    } else if (device === 'iOS') {
        
        e.preventDefault();
        trackTG('ПОПЫТКА_ОТКРЫТЬ_ВНЕШНИЙ_БРАУЗЕР', 'Метод: googlechrome://');
        window.location.href = "googlechrome://" + fullExternalUrl.replace(/^https?:\/\//, "");

        // Если Chrome не установлен или блокировка
        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                trackTG('НЕ_УДАЛОСЬ_ОТКРЫТЬ_ВНЕШНИЙ_БРАУЗЕР', 'Причина: Chrome не установлен или iOS заблокировал переход. ПЕРЕВОД НА ФОЛЛ БЕК');
                window.location.href = fullExternalUrl;
            }
        }, 1000);

    } else {
        
        e.preventDefault();
        trackTG('ПЕРЕХОД_НА_СЛЕДУЮЩУЮ_СТРАНИЦУ', 'Браузер уже внешний или это Десктоп');
        
        setTimeout(function() {
            window.location.href = fullExternalUrl;
        }, 800);
    }
});
</script>

</body>
</html>
