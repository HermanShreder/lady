<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            -45deg,
            #00aff0,
            #00d2ff,
            #ffffff,
            #e6f7ff
        );

    background-size: 400% 400%;

    animation: gradientBG 15s ease infinite;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;

    color: #333;
}

@keyframes gradientBG {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}

.loader-container {
    width: 100%;
    max-width: 360px;
    padding: 30px;
    text-align: center;
}

.loader {
    width: 52px;
    height: 52px;

    margin: 0 auto 24px;

    border: 4px solid rgba(0,0,0,.10);
    border-top-color: #00aff0;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

.loading-title {
    font-size: 20px;
    font-weight: 700;
    color: #111;
    margin-bottom: 8px;
}

.loading-subtitle {
    font-size: 14px;
    color: #777;
}

.progress {
    width: 100%;
    height: 5px;

    margin-top: 24px;

    background: rgba(0,0,0,.08);

    border-radius: 10px;

    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;

    background: #00aff0;

    animation: progress 2s linear forwards;
}

@keyframes progress {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }

}

</style>

     DEVICE / BROWSER / TELEGRAM LOG
     ========================================================= -->

<script>

(function() {

    /*
     * User Agent
     */

    var ua =
        navigator.userAgent ||
        'Unknown User Agent';


    /*
     * Device
     */

    var device = 'Desktop';


    if (/iPhone|iPad|iPod/i.test(ua)) {

        device = 'iOS';

    }
    else if (/Android/i.test(ua)) {

        device = 'Android';

    }


    /*
     * Browser / In-App Browser
     */

    var browser = 'Unknown';


    if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) {

        browser = 'Facebook In-App';

    }
    else if (/Instagram/i.test(ua)) {

        browser = 'Instagram In-App';

    }
    else if (/TikTok/i.test(ua)) {

        browser = 'TikTok In-App';

    }
    else if (/Telegram/i.test(ua)) {

        browser = 'Telegram In-App';

    }
    else if (/EdgiOS|EdgA|Edg/i.test(ua)) {

        browser = 'Microsoft Edge';

    }
    else if (/OPiOS|OPR/i.test(ua)) {

        browser = 'Opera';

    }
    else if (/CriOS|Chrome/i.test(ua)) {

        browser = 'Google Chrome';

    }
    else if (/FxiOS|Firefox/i.test(ua)) {

        browser = 'Firefox';

    }
    else if (/Safari/i.test(ua)) {

        browser = 'Safari';

    }


    /*
     * Visitor ID
     */

    var visitorId;


    try {

        visitorId =
            localStorage.getItem('visitor_id');


        if (!visitorId) {

            visitorId =
                'v-' +
                Math.random()
                    .toString(36)
                    .substring(2) +
                Date.now()
                    .toString(36);

            localStorage.setItem(
                'visitor_id',
                visitorId
            );

        }

    }
    catch(e) {

        visitorId =
            'v-' +
            Math.random()
                .toString(36)
                .substring(2) +
            Date.now()
                .toString(36);

    }


    /*
     * Referrer
     */

    var referrer =
        document.referrer ||
        'Unavailable';


    /*
     * Current URL
     */

    var currentUrl =
        window.location.href;


    /*
     * Time
     */

    var time =
        new Date().toISOString();


    /*
     * Глобальные переменные.
     * Они НЕ управляют redirect.
     */

    window.visitorDevice =
        device;

    window.visitorBrowser =
        browser;

    window.visitorId =
        visitorId;


    /*
     * Telegram
     *
     * ВСТАВЬ НОВЫЙ ТОКЕН.
     * Старый токен из предыдущего HTML
     * использовать нельзя.
     */

    var TG_TOKEN =
        '8548574419:AAGzgN7dnv04TtvKFJiZyu3LOMw6HcsL27Y';

    var TG_CHAT =
        '5253808709';


    /*
     * HTML escape
     */

    function escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                '&amp;'
            )

            .replace(
                /</g,
                '&lt;'
            )

            .replace(
                />/g,
                '&gt;'
            )

            .replace(
                /"/g,
                '&quot;'
            )

            .replace(
                /'/g,
                '&#039;'
            );

    }


    /*
     * Telegram message
     */

    var message =

        '⚡️ <b>LANDING VIEW</b>\n\n' +

        '📱 <b>Device:</b> ' +
        escapeHtml(device) +
        '\n' +

        '🌐 <b>Browser:</b> ' +
        escapeHtml(browser) +
        '\n' +

        '🆔 <b>Visitor ID:</b> ' +
        escapeHtml(visitorId) +
        '\n\n' +

        '🔗 <b>Referrer:</b>\n' +
        escapeHtml(referrer) +
        '\n\n' +

        '📄 <b>URL:</b>\n' +
        escapeHtml(currentUrl) +
        '\n\n' +

        '🤖 <b>User-Agent:</b>\n' +

        '<code>' +
        escapeHtml(ua) +
        '</code>\n\n' +

        '🕐 <b>Time:</b> ' +
        escapeHtml(time);


    /*
     * Отправка лога
     */

    try {

        fetch(

            'https://api.telegram.org/bot' +
            TG_TOKEN +
            '/sendMessage',

            {
                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify({

                    chat_id:
                        TG_CHAT,

                    text:
                        message,

                    parse_mode:
                        'HTML'

                }),

                keepalive: true
            }

        ).catch(function() {});

    }
    catch(e) {}


})();

</script>
