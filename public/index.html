    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(-45deg,#00aff0,#00d2ff,#ffffff,#e6f7ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #333;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }

        .card {
            background: rgba(255,255,255,.95);

        .open-btn {
            display: inline-block;
            background: #00aff0;
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,175,240,0.4);
            transition: transform 0.2s, background 0.2s;
            width: 80%;
        }
        .open-btn:active {
            transform: scale(0.95);
            background: #008ecc;
        }
        
        h1 { font-size: 22px; margin-bottom: 10px; color: #111; }

    <script>
        /* ==========================================
           CONFIG
        ========================================== */
        window.LANDING_DATA = {
            isIOS: /iPhone|iPad|iPod/i.test(navigator.userAgent),
            isAndroid: /Android/i.test(navigator.userAgent),
            isInApp: /FBAN|FBAV|FB_IAB|FBIS|Instagram|TikTok|Messenger|Telegram/i.test(navigator.userAgent),

        /* ==========================================
           LOGGING
        ========================================== */
        window.sendTG = function(action) {
            var TG_TOKEN = '8548574419:AAGzgN7dnv04TtvKFJiZyu3LOMw6HcsL27Y';
            var TG_CHAT = '5253808709';
            var dev = window.LANDING_DATA.isIOS ? '🍎 iOS' : (window.LANDING_DATA.isAndroid ? '🤖 Android' : '💻 Other');
            var msg = '<b>🖱️ BUTTON CLICK</b>\n📱 ' + dev + '\n⚙️ ' + action;
            
            try {
                navigator.sendBeacon('https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage', 
                    JSON.stringify({ chat_id: TG_CHAT, text: msg, parse_mode: 'HTML' }));
            } catch(e) {}
        };

        /* ==========================================
           MANUAL REDIRECT FUNCTION
        ========================================== */
        function openLink() {
            var url = window.LANDING_DATA.TARGET_URL;
            
            // Отправляем Lead в FB при клике
            if(typeof fbq !== 'undefined') fbq('track', 'Lead');

            // 1. ANDROID INTENT (Открывает именно Chrome)
            if (window.LANDING_DATA.isAndroid && window.LANDING_DATA.isInApp) {
                sendTG('Android Intent -> Chrome');
                var host = url.replace(/^https?:\/\//i, '');
                var intent = 'intent://' + host + '#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end;';
                window.location.href = intent;
                return;
            }

            // 2. iOS (Открывает Safari/Chrome)
            if (window.LANDING_DATA.isIOS) {
                sendTG('iOS Open Link');
                window.open(url, '_blank');
                return;
            }

            // 3. Остальные
            sendTG('Standard Click');
            window.location.href = url;
        }
