  <style>
    :root {
      --of-blue: #00aff0;
      --of-dark: #15171a;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a1c20 0%, #0d1117 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* Декоративные пятна на фоне */
    .bg-blob {
      position: absolute;
      width: 300px;
      height: 300px;
      background: var(--of-blue);
      filter: blur(150px);
      opacity: 0.35;
      border-radius: 50%;
      z-index: 0;
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .blob-1 { top: -50px; left: -50px; }
    .blob-2 { bottom: -50px; right: -50px; background: #8e44ad; animation-delay: 3s; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.35; }
      100% { transform: scale(1.2); opacity: 0.5; }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 420px;
      perspective: 1000px;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(30px);
      animation: cardAppear 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    @keyframes cardAppear {
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(45deg, #00aff0, #007bb5);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0, 175, 240, 0.3);
    }

    .verified-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #00aff0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #15171a;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 30px;
    }

    .btn-main {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--of-blue);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 30px rgba(0, 175, 240, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0, 175, 240, 0.5);
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-main::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.6s;
    }
    
    .btn-main:hover::after {
      left: 100%;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>

</head>

<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="container">
    <div class="card">
      
      <div class="avatar-wrapper">
        <div class="avatar">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

          </svg>
        </div>
      </div>

      <h1>Private Content</h1>
      <p>Для просмотра эксклюзивного контента необходимо открыть ссылку в защищенном браузере.</p>

      <button id="accessBtn" class="btn-main">
        Открыть доступ
      </button>

      <div class="footer-note">
        Secure Connection • Verified Profile
      </div>
    </div>
  </div>

  <script>
    const TARGET_URL = "https://fansly.com/Elinamissss/t0";

    document.getElementById('accessBtn').addEventListener('click', function(e) {
      e.preventDefault();

      // 1. Отправка события Lead в Facebook (Пиксель)
      try {
        if (typeof fbq === "function") {
          fbq('track', 'Lead', {
            content_name: 'Fansly Access Clicked',
            value: 1.00,
            currency: 'USD'
          });
        }
      } catch (err) { console.error("Pixel error:", err); }

      // 2. Определение устройства
      const ua = navigator.userAgent || "";
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      // 3. Логика перехода
      if (isAndroid) {
        // ЖЕСТКИЙ ИНТЕНТ ДЛЯ CHROME НА ANDROID
        // Принудительно открывает приложение Chrome
        const intentUrl = `intent://${TARGET_URL.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(TARGET_URL)};end`;
        window.location.href = intentUrl;
      } 
      else if (isIOS) {
        // ОТКРЫТИЕ ЧЕРЕЗ GOOGLE CHROME НА IPHONE
        // Используем схему googlechrome://
        const chromeUrl = TARGET_URL.replace(/^https?:\/\//, 'googlechrome://');
        
        // Пробуем открыть Chrome
        window.location.href = chromeUrl;

        // Fallback: Если через 1.5 секунды мы все еще здесь (Chrome не открылся), открываем в Safari
        setTimeout(function() {
            window.location.href = TARGET_URL;
        }, 1500);
      } 
      else {
        // Для ПК и остальных устройств
        window.location.href = TARGET_URL;
      }
    });
  </script>
