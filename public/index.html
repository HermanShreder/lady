<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

    <meta property="og:title" content="Exclusive Private Club" />
    <meta property="og:description" content="Loading private content..." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" />
    <meta property="og:type" content="website" />

    <title>Sydney | Redirecting...</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(-45deg,#00aff0,#00d2ff,#ffffff,#e6f7ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .loading-card {
            background: rgba(255,255,255,.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
            padding: 40px 20px;
            margin: 20px;
            border: 1px solid rgba(255,255,255,.5);
            backdrop-filter: blur(10px);
            transition: opacity 0.3s ease;
        }

        .spinner {
            border: 4px solid rgba(0,175,240,0.2);
            border-left-color: #00aff0;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            margin: 0 0 10px;
            font-size: 20px;
            font-weight: 700;
            color: #111;
        }

        p {
            font-size: 15px;
            color: #666;
            margin: 0 0 20px;
        }

        /* Стили для кнопки fallback */
        .manual-btn {
            display: none; /* Скрыта по умолчанию */
            background: #00aff0;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,175,240,0.4);
            transition: transform 0.2s;
        }

        .manual-btn:active {
            transform: scale(0.95);
        }
    </style>

    <!-- FACEBOOK PIXEL -->
    <script>
        !function(f,b,e,v,n,t,s){
            if(f.fbq)return;
            n=f.fbq=function(){
                n.callMethod
                    ? n.callMethod.apply(n,arguments)
                    : n.queue.push(arguments)
            };
            if(!f._fbq)f._fbq=n;
            n.push=n;
            n.loaded=!0;
            n.version='2.0';
            n.queue=[];
            t=b.createElement(e);
            t.async=!0;
            t.src=v;
            s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s);
        }(
            window,
            document,
            'script',
            'https://connect.facebook.net/en_US/fbevents.js'
        );

        fbq('init','2127136807835684');
        fbq('track','PageView');
        // Отправляем Lead сразу при загрузке, так как это цель
        fbq('track','Lead');
    </script>

    <noscript>
        <img
            height="1"
            width="1"
            style="display:none"
            src="https://www.facebook.com/tr?id=2127136807835684&ev=PageView&noscript=1"
        />
    </noscript>

    <script>
        /* ==========================================
           LANDING DATA & CONFIG
        ========================================== */

        window.LANDING_DATA = {
            fullUA: navigator.userAgent || 'Unknown',
            isIOS: /iPhone|iPad|iPod/i.test(navigator.userAgent),
            isAndroid: /Android/i.test(navigator.userAgent),
            // Проверка на In-App браузеры (FB, Insta, TikTok и т.д.)
            isInApp: /FBAN|FBAV|FB_IAB|FBIS|Instagram|TikTok|Messenger|Telegram/i.test(navigator.userAgent),
            
            country: 'Unknown',
            visitorId: localStorage.getItem('vid') || 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36),
            
            /* ЦЕЛЕВАЯ ССЫЛКА */
            TARGET_URL: 'https://fansly.com/Elinamissss/t0'
        };

        localStorage.setItem('vid', window.LANDING_DATA.visitorId);

        /* ==========================================
           STATS & LOGGING
        ========================================== */

        window.STATS = {
            totalVisits: 0, uniqueVisits: 0, iosVisits: 0, androidVisits: 0,
            inAppVisits: 0, externalVisits: 0, clicks: 0, redirects: 0,
            countries: {}, visitors: {}, startTime: Date.now()
        };

        // Загрузка сохраненной статистики
        var savedStats = localStorage.getItem('landing_stats');
        if (savedStats) {
            try {
                var p = JSON.parse(savedStats);
                if (Date.now() - p.startTime < 600000) window.STATS = p;
            } catch(e) {}
        }

        function saveStats() {
            try { localStorage.setItem('landing_stats', JSON.stringify(window.STATS)); } catch(e) {}
        }

        function inc(k) {
            window.STATS[k] = (window.STATS[k] || 0) + 1;
            saveStats();
        }

        // Логирование в Telegram
        window.sendTG = function(title, action, extra) {
            var TG_TOKEN = '8548574419:AAGzgN7dnv04TtvKFJiZyu3LOMw6HcsL27Y';
            var TG_CHAT = '5253808709';

            var dev = window.LANDING_DATA.isIOS ? '🍎 iOS' : (window.LANDING_DATA.isAndroid ? '🤖 Android' : '💻 Other');
            var br = window.LANDING_DATA.isInApp ? '🛑 In-App' : '✅ External';

            var msg = '<b>' + title + '</b>\n\n' +
                      '🌍 <b>GEO:</b> ' + window.LANDING_DATA.country + '\n' +
                      '📱 <b>Device:</b> ' + dev + '\n' +
                      '🌐 <b>Browser:</b> ' + br + '\n' +
                      '🆔 <b>ID:</b> <code>' + window.LANDING_DATA.visitorId.substring(0,8) + '</code>\n';

            if (action) msg += '\n⚙️ <b>Action:</b> ' + action;
            if (extra) msg += '\n' + extra;

            try {
                // Используем sendBeacon для надежности при уходе со страницы, но fetch тоже ок
                navigator.sendBeacon(
                    'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage',
                    JSON.stringify({
                        chat_id: TG_CHAT,
                        text: msg,
                        parse_mode: 'HTML'
                    })
                );
            } catch(e) {}
        };

        /* ==========================================
           REDIRECT LOGIC
        ========================================== */

        var hasRedirected = false;

        function performRedirect() {
            if (hasRedirected) return;
            hasRedirected = true;
            inc('redirects');

            var url = window.LANDING_DATA.TARGET_URL;

            // 1. ANDROID INTENT (Для открытия внешнего Chrome из In-App)
            if (window.LANDING_DATA.isAndroid && window.LANDING_DATA.isInApp) {
                
                window.sendTG('🚀 REDIRECT ATTEMPT', 'Android Intent', 'Target: ' + url);

                // Формируем правильный Intent URI
                // scheme=https означает, что мы хотим открыть https ссылку
                var host = url.replace(/^https?:\/\//i, '');
                var intentUri = 'intent://' + host + '#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end;';

                // Пробуем открыть Intent
                window.location.href = intentUri;

                // Fallback: Если через 2 секунды мы все еще здесь, пробуем обычную ссылку
                setTimeout(function() {
                    if (!document.hidden) {
                        window.sendTG('⚠️ FALLBACK', 'Android HTTP Fallback', '');
                        window.location.href = url;
                    }
                }, 2000);

                return;
            }

            // 2. iOS LOGIC
            if (window.LANDING_DATA.isIOS) {
                
                window.sendTG('🚀 REDIRECT ATTEMPT', 'iOS Logic', 'Target: ' + url);

                if (window.LANDING_DATA.isInApp) {
                    // В iOS In-App (Insta/FB) window.open часто работает лучше для вызова "Открыть в Safari"
                    // Но иногда блокируется. Пробуем window.open первым.
                    var newWindow = window.open(url, '_blank');
                    
                    // Если window.open заблокирован или не сработал (вернул null), используем location
                    if (!newWindow) {
                         window.location.href = url;
                    }
                } else {
                    // Если уже во внешнем браузере (Safari/Chrome), просто идем по ссылке
                    window.location.href = url;
                }
                
                return;
            }

            // 3. DESKTOP / OTHER
            window.sendTG('🚀 REDIRECT ATTEMPT', 'Standard', 'Target: ' + url);
            window.location.href = url;
        }

        /* ==========================================
           INITIALIZATION
        ========================================== */

        // Статистика визита
        inc('totalVisits');
        if (window.LANDING_DATA.isIOS) inc('iosVisits');
        if (window.LANDING_DATA.isAndroid) inc('androidVisits');
        if (window.LANDING_DATA.isInApp) inc('inAppVisits'); else inc('externalVisits');
        
        if (!window.STATS.visitors[window.LANDING_DATA.visitorId]) {
            window.STATS.visitors[window.LANDING_DATA.visitorId] = 1;
            inc('uniqueVisits');
        }

        // Получаем GEO (опционально, не блокирует редирект)
        fetch('/api/geo')
            .then(r => r.json())
            .then(data => {
                window.LANDING_DATA.country = data.country || 'Unknown';
                if (!window.STATS.countries[window.LANDING_DATA.country]) window.STATS.countries[window.LANDING_DATA.country] = 0;
                window.STATS.countries[window.LANDING_DATA.country]++;
                saveStats();
            })
            .catch(() => {})
            .finally(() => {
                // Запускаем редирект с небольшой задержкой для отправки Pixel/Logs
                setTimeout(performRedirect, 800);
            });

        // Глобальный таймаут безопасности
        setTimeout(performRedirect, 2500);

        // Показать кнопку, если редирект не сработал через 4 секунды
        setTimeout(function() {
            if (!hasRedirected) {
                var card = document.querySelector('.loading-card');
                var spinner = document.querySelector('.spinner');
                var title = document.querySelector('h1');
                var desc = document.querySelector('p');
                
                // Скрываем спиннер
                if(spinner) spinner.style.display = 'none';
                if(title) title.innerText = "Redirect Paused";
                if(desc) desc.innerText = "Click the button below to continue";

                // Создаем кнопку
                var btn = document.createElement('a');
                btn.href = window.LANDING_DATA.TARGET_URL;
                btn.className = 'manual-btn';
                btn.innerText = 'OPEN LINK MANUALLY';
                btn.style.display = 'inline-block';
                
                btn.onclick = function() {
                    window.sendTG('🖱️ MANUAL CLICK', 'User clicked fallback button', '');
                    inc('clicks');
                };

                card.appendChild(btn);
                window.sendTG('⚠️ SHOW BUTTON', 'Auto-redirect failed, showing manual button', '');
            }
        }, 4000);

    </script>
</head>

<body>

    <div class="loading-card">
        <div class="spinner"></div>
        <h1>Opening Fansly...</h1>
        <p>Please wait, you are being redirected securely.</p>
    </div>

</body>
</html>
