<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Exclusive Content | Access</title>

  <style>
    :root {
      --of-blue: #00aff0;
      --of-dark: #15171a;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      /* Красивый темный градиент */
      background: linear-gradient(135deg, #1a1c20 0%, #0d1117 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* Декоративные пятна на фоне */
    .bg-blob {
      position: absolute;
      width: 300px;
      height: 300px;
      background: var(--of-blue);
      filter: blur(150px);
      opacity: 0.4;
      border-radius: 50%;
      z-index: 0;
    }
    .blob-1 { top: -50px; left: -50px; }
    .blob-2 { bottom: -50px; right: -50px; background: #8e44ad; }

    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 420px;
      perspective: 1000px;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      
      /* Анимация появления */
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(45deg, #00aff0, #007bb5);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 20px rgba(0, 175, 240, 0.3);
    }

    .verified-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #00aff0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #15171a;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 30px;
    }

    .btn-main {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--of-blue);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 25px rgba(0, 175, 240, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 175, 240, 0.5);
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    /* Блик на кнопке */
    .btn-main::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s;
    }
    
    .btn-main:hover::after {
      left: 100%;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
    }

  </style>

  <!-- META PIXEL CODE -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    // Ваш ID пикселя
    fbq('init', '909063091813143'); 
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none" 
    src="https://www.facebook.com/tr?id=909063091813143&ev=PageView&noscript=1"/>
  </noscript>
  <!-- END META PIXEL CODE -->

</head>

<body>

  <!-- Фоновые элементы -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="container">
    <div class="card" id="mainCard">
      
      <div class="avatar-wrapper">
        <div class="avatar">
          <!-- Иконка замка -->
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div class="verified-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>

      <h1>Private Access</h1>
      <p>Эксклюзивный контент доступен только в защищенном браузере. Нажмите кнопку ниже для входа.</p>

      <button id="accessBtn" class="btn-main">
        Открыть доступ
      </button>

      <div class="footer-note">
        Secure Connection • Verified Profile
      </div>
    </div>
  </div>

  <script>
    /* =========================
       НАСТРОЙКИ ССЫЛОК
    ========================== */
    
    // !!! ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ НА INSTAGRAM !!!
    const INSTAGRAM_URL = "https://instagram.com/ВАШ_НИК"; 
    
    // Ссылка на Telegram или ваш основной сайт
    const TARGET_URL = "https://t.me/workfortou"; 

    /* =========================
       ЛОГИКА РАЗДЕЛЕНИЯ ТРАФИКА
    ========================== */
    
    const ua = navigator.userAgent || "";
    
    // Проверка на приложения Meta (Instagram, Facebook)
    const isMetaApp = /FBAN|FBAV|FB_IAB|FBIS|Instagram|Messenger/i.test(ua);

    if (isMetaApp) {
        // Если зашли из Инсты/ФБ -> редирект на Инсту
        window.location.replace(INSTAGRAM_URL);
    } else {
        // Если обычный браузер -> показываем красивую карточку
        document.getElementById('mainCard').classList.add('visible');
        
        // Обработчик кнопки
        document.getElementById('accessBtn').addEventListener('click', function() {
            
            // 1. Отправляем событие Lead в Facebook
            try {
                if (typeof fbq === "function") {
                    fbq('track', 'Lead', {
                        content_name: 'Access Clicked',
                        value: 1.00,
                        currency: 'USD'
                    });
                }
            } catch (e) {
                console.log("Pixel error", e);
            }

            // 2. Переход по ссылке
            window.location.href = TARGET_URL;
        });
    }
  </script>

</body>
</html>
