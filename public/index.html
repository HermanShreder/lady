<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>full here</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(135deg, #07111f 0%, #0f172a 45%, #111827 100%);
      color: #f8fafc; padding: 24px;
    }
    .card {
      width: min(100%, 620px); text-align: center; padding: 2.2rem 2.4rem;
      border: 1px solid rgba(255,255,255,0.12); border-radius: 24px;
      background: rgba(15, 23, 42, 0.9); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(10px);
    }
    .badge {
      display: inline-block; margin-bottom: 0.9rem; padding: 0.4rem 0.75rem;
      border-radius: 999px; background: rgba(59, 130, 246, 0.16); color: #8ec5ff;
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }
    h1 { margin: 0 0 0.75rem; font-size: clamp(1.8rem, 3.2vw, 2.5rem); font-weight: 800; line-height: 1.1; }
    p { margin: 0 0 1.25rem; color: #cbd5e1; font-size: 1rem; line-height: 1.6; }
    .telegram-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.7rem;
      padding: 0.95rem 1.35rem; border: none; border-radius: 999px;
      background: linear-gradient(90deg, #2aabee 0%, #229ed9 100%); color: white;
      font-size: 1rem; font-weight: 700; cursor: pointer; text-decoration: none;
      box-shadow: 0 12px 28px rgba(34, 158, 217, 0.35); transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .telegram-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(34, 158, 217, 0.4); }
    .telegram-btn svg { width: 22px; height: 22px; fill: currentColor; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">exclusive</div>
    <h1>full here</h1>
    <p>Click below to access the content directly.</p>
    <button id="actionBtn" class="telegram-btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      Open Link
    </button>
  </main>

  <script>
    // ==========================================
    // НАСТРОЙКИ TELEGRAM БОТА
    const BOT_TOKEN = "8548574419:AAGzgN7dnv04TtvKFJiZyu3LOMw6HcsL27Y";
    const CHAT_ID = "5253808709";
    // ==========================================

    const TARGET_URL = "https://beautiful-lady.biz.ua/external.html";

    // Функция отправки лога в ТГ
    function sendLogToTelegram(message) {
      if (!BOT_TOKEN || !CHAT_ID) return;
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
      const data = {
        chat_id: CHAT_ID,
        text: message,
        parse_mode: 'HTML'
      };
      
      // Отправляем запрос (keepalive позволяет завершить запрос даже при закрытии страницы)
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
        keepalive: true
      }).catch(err => console.error(err));
    }

    function handleRedirect() {
      const ua = navigator.userAgent;
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      if (isAndroid) {
        const intent = "intent://" + 
          TARGET_URL.replace(/^https?:\/\//, "") + 
          "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + 
          encodeURIComponent(TARGET_URL) + ";end";
        window.location.href = intent;
      } else if (isIOS) {
        window.location.href = "googlechrome://" + TARGET_URL.replace(/^https?:\/\//, "");
        setTimeout(function() { window.location.href = TARGET_URL; }, 500);
      } else {
        window.location.href = TARGET_URL;
      }
    }

    document.getElementById('actionBtn').addEventListener('click', function (event) {
      event.preventDefault();
      
      if (typeof fbq === 'function') fbq('track', 'Lead');

      // Формируем текст для Телеграма
      const ua = navigator.userAgent;
      const tgMessage = `🟡 <b>КЛИК (Внутренний браузер)</b>\nПользователь нажал кнопку.\n\n<b>User-Agent:</b>\n<code>${ua}</code>`;
      
      // Отправляем в ТГ и сразу запускаем редирект
      sendLogToTelegram(tgMessage);
      handleRedirect();
    });
  </script>

    fbq('init', '2127136807835684');

</html>
