<script>

function saveStats(){try{localStorage.setItem('landing_stats',JSON.stringify(window.STATS))}catch(e){}}
function inc(k){window.STATS[k]=(window.STATS[k]||0)+1;saveStats()}

<script>

    if(!window.LANDING_DATA.isInApp||window.location.search.indexOf('ext=1')!==-1){

(function(){
    var button=document.getElementById('ctaButton');
    if(!button)return;
    var locked=false;

    button.addEventListener('click',function(e){
        e.preventDefault();
        if(locked)return;
        locked=true;
        button.innerText='LOADING...';
        button.style.opacity='0.8';
        inc('clicks');
        try{if(typeof fbq==='function')fbq('track','Lead')}catch(e){}

            inc('redirects');
