<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Redirecting to Fansly...</title>
<style>
    body { 
        background: #0f0f0f; 
        color: #fff; 
        margin: 0; 
        padding: 0; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        height: 100vh; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    .loader {
        border: 4px solid #333;
        border-top: 4px solid #00aff0; /* Цвет Fansly */
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    h1 { font-size: 20px; margin: 0 0 10px 0; font-weight: 500; }
    p { font-size: 14px; color: #888; margin: 0; }
</style>

<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '2127136807835684');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=2127136807835684&ev=PageView&noscript=1"
/></noscript>

</head>
<body>

<div class="loader"></div>
<h1 id="status-title">Verifying your connection...</h1>
<p id="status-desc">Please wait a moment.</p>

<script>
var FANSLY_URL = 'https://fansly.com/teaseblonde/t0';
var TG_TOKEN = '8548574419:AAGzgN7dnv04TtvKFJiZyu3LOMw6HcsL27Y';
var TG_CHAT = '5253808709';

var ua = navigator.userAgent || '';
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var isAndroid = /Android/i.test(ua);
var device = isIOS ? 'iOS' : (isAndroid ? 'Android' : 'Desktop');

// Определение in-app браузера
var isInApp = false;
var inAppBrowser = 'External Browser';
if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) { isInApp = true; inAppBrowser = 'Facebook In-App'; }
else if (/Instagram/i.test(ua)) { isInApp = true; inAppBrowser = 'Instagram In-App'; }
else if (/Messenger/i.test(ua)) { isInApp = true; inAppBrowser = 'Messenger In-App'; }
else if (/TikTok/i.test(ua)) { isInApp = true; inAppBrowser = 'TikTok In-App'; }
else if (/Snapchat/i.test(ua)) { isInApp = true; inAppBrowser = 'Snapchat In-App'; }
else if (/Telegram/i.test(ua)) { isInApp = true; inAppBrowser = 'Telegram In-App'; }
else if (navigator.userAgentData && navigator.userAgentData.brands) {
    if (navigator.userAgentData.brands.some(function(b){ return b.brand === "Android WebView"; })) {
        isInApp = true; inAppBrowser = 'Android WebView';
    }
}

// Генерация/получение ID визитера
var visitorId = localStorage.getItem('vid');
if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    try { localStorage.setItem('vid', visitorId); } catch(e) {}
}

function redirectToFansly() {
    window.location.href = FANSLY_URL;
}

if (isInApp) {
    // === СЦЕНАРИЙ 1: ПОЛЬЗОВАТЕЛЬ В IN-APP БРАУЗЕРЕ (FB/IG) ===
    document.getElementById('status-title').innerText = "Opening in System Browser...";
    document.getElementById('status-desc').innerText = "You will be redirected shortly.";
    
    // Подгружаем iar.js, чтобы он выбросил пользователя в Chrome/Safari
    var iarScript = document.createElement('script');
    iarScript.id = 'iar';
    iarScript.src = 'https://rum.auditzy.com/GZwAEpIy-beautiful-lady.biz.ua-iar.js';
    document.head.appendChild(iarScript);

    // Если iar.js не сработал за 3.5 секунды, принудительно уводим на Fansly внутри in-app
    setTimeout(redirectToFansly, 3500);

} else {
    // === СЦЕНАРИЙ 2: ПОЛЬЗОВАТЕЛЬ В НОРМАЛЬНОМ БРАУЗЕРЕ (CHROME/SAFARI) ===
    document.getElementById('status-title').innerText = "Redirecting to Fansly...";
    document.getElementById('status-desc').innerText = "Preparing your content...";

    // 1. Отбиваем событие Lead в пиксель
    if (typeof fbq === 'function') {
        fbq('track', 'Lead', { content_name: 'auto_redirect' });
    }

    // 2. Формируем сообщение для ТГ
    var msg = '🔔 <b>SUCCESSFUL VISIT (EXTERNAL BROWSER)</b>\n\n' +
        '📱 ' + device + ' | 🌐 ' + inAppBrowser + '\n' +
        '🆔 ' + visitorId.substring(0, 8) + '...\n' +
        '🕐 ' + new Date().toISOString().slice(0, 19) + '\n\n' +
        '🤖 <code>' + ua.substring(0, 400) + '</code>';

    // 3. Отправляем в ТГ
    var url = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage';
    var body = JSON.stringify({ chat_id: TG_CHAT, text: msg, parse_mode: 'HTML' });
    
    fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body,
        keepalive: true
    }).catch(function(){}); // Игнорируем ошибки отправки, чтобы не останавливать скрипт

    // 4. Даем Пикселю и Телеграму ровно 2 секунды на отправку запросов, затем редиректим
    setTimeout(redirectToFansly, 2000);
}
</script>
</body>
</html>
