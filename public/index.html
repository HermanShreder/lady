<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #fff;
    color: #333;
    text-align: center;
    padding: 20px;
}

.title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 24px;
    color: #333;
}

.btn {
    display: inline-block;
    padding: 16px 32px;
    background: #00aff0;
    color: #fff;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 4px 12px rgba(0,175,240,0.3);
    transition: transform 0.1s;
}

.btn:active {
    transform: scale(0.98);
}
</style>

</head>

<body>

<div class="title">Tap to continue in browser</div>

<a id="openBtn" class="btn">
    Open in Browser
</a>

<script>
let visitorId = localStorage.getItem('visitor_id');

if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem('visitor_id', visitorId);
}

const VERSION = '2026-08-11-BRIDGE-FULL-TRACK';
const EXTERNAL_URL = "/external.html?v=" + encodeURIComponent(visitorId);
const fullExternalUrl = location.origin + EXTERNAL_URL;

var ua = navigator.userAgent || '';
var device = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : 'Desktop');

// Точная диагностика текущего браузера
function detectBrowser(ua) {
    if (/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger/i.test(ua)) return 'facebook_inapp';
    if (/Telegram/i.test(ua)) return 'telegram';
    if (/Android/i.test(ua)) {
        if (/SamsungBrowser/i.test(ua)) return 'samsung_android';
        if (/EdgA/i.test(ua)) return 'edge_android';
        if (/OPR/i.test(ua)) return 'opera_android';
        if (/Firefox/i.test(ua)) return 'firefox_android';
        if (/Chrome/i.test(ua)) return 'chrome_android';
        return 'android_other';
    }
    if (/iPhone|iPad|iPod/i.test(ua)) {
        if (/CriOS/i.test(ua)) return 'chrome_ios';
        if (/FxiOS/i.test(ua)) return 'firefox_ios';
        if (/EdgiOS/i.test(ua)) return 'edge_ios';
        if (/Safari/i.test(ua)) return 'safari_ios';
        return 'ios_other';
    }
    if (/Chrome/i.test(ua)) return 'chrome_desktop';
    if (/Firefox/i.test(ua)) return 'firefox_desktop';
    if (/Safari/i.test(ua)) return 'safari_desktop';
    return 'other';
}

const currentBrowser = detectBrowser(ua);
var isFB = (currentBrowser === 'facebook_inapp');

function trackTG(action, details) {
    var d = new URLSearchParams({
        action: action,
        device: device,
        details: details || '',
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language || '?',
        visitor: visitorId,
        page: 'bridge',
        version: VERSION,
        browser: currentBrowser,
        ua: ua // Отправляем реальный User-Agent внутреннего браузера
    });

    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', d);
    } else {
        fetch('/api/track', { method: 'POST', body: d, keepalive: true }).catch(function(){});
    }
}

// ---------------------------------------------------------
// ОБРАБОТКА СВОРАЧИВАНИЯ (ЭТО ЕЩЕ НЕ УСПЕХ!)
// ---------------------------------------------------------
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
        trackTG('ВКЛАДКА_СВЕРНУТА', 'Ожидаем запуск внешнего браузера. Переход еще не подтвержден.');
    }
});

trackTG('ПРОКЛАДКА_ОТКРЫТА', 'Браузер: ' + currentBrowser);

const openBtn = document.getElementById('openBtn');

// 1. Формируем правильный href
if (device === 'Android' && isFB) {
    const intentUrl = 
        'intent://' + 
        fullExternalUrl.replace(/^https?:\/\//, '') + 
        '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.android.chrome;S.browser_fallback_url=' + 
        encodeURIComponent(fullExternalUrl) + ';end';
    openBtn.href = intentUrl;
} else {
    openBtn.href = fullExternalUrl;
}

// 2. ОБРАБОТЧИК КЛИКА
openBtn.addEventListener('click', function(e) {
    
    if (typeof fbq === 'function') {
        fbq('track', 'Lead', { content_name: 'bridge_click' });
    }

    trackTG('КЛИК_ПО_ССЫЛКЕ', 'Событие пикселя отправлено');

    if (device === 'Android' && isFB) {
        
        trackTG('ПОПЫТКА_ОТКРЫТЬ_ВНЕШНИЙ_БРАУЗЕР', 'Метод: Android Intent');
        
        // Спасательный таймер: если Intent заблокирован намертво
        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                trackTG('НЕ_УДАЛОСЬ_ОТКРЫТЬ_ВНЕШНИЙ_БРАУЗЕР', 'Причина: In-App браузер заблокировал Intent. ПЕРЕВОД НА ФОЛЛ БЕК (внутри FB)');
                window.location.href = fullExternalUrl;
            }
        }, 2000);
        
    } else if (device === 'iOS' && isFB) {
        
        e.preventDefault();
        trackTG('ПОПЫТКА_ОТКРЫТЬ_ВНЕШНИЙ_БРАУЗЕР', 'Метод: googlechrome://');
        window.location.href = "googlechrome://" + fullExternalUrl.replace(/^https?:\/\//, "");

        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                trackTG('НЕ_УДАЛОСЬ_ОТКРЫТЬ_ВНЕШНИЙ_БРАУЗЕР', 'Причина: Chrome не установлен или блокировка. ПЕРЕВОД НА ФОЛЛ БЕК');
                window.location.href = fullExternalUrl;
            }
        }, 1000);

    } else {
        
        e.preventDefault();
        trackTG('ПЕРЕХОД_НА_СЛЕДУЮЩУЮ_СТРАНИЦУ', 'Браузер уже внешний или это Десктоп');
        setTimeout(function() {
            window.location.href = fullExternalUrl;
        }, 800);
    }
});
</script>

</body>
</html>
