<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Выберите браузер</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #000;
    }

    .card {
      background: #ffffff;
      max-width: 400px;
      width: 90%;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      /* Скрываем контент до проверки */
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card.visible {
      opacity: 1;
    }

    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #000;
    }

    .desc {
      font-size: 15px;
      color: #707579;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .btn {
      display: block;
      width: 100%;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      padding: 14px 20px;
      border-radius: 8px;
      transition: background-color 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      border: none;
      margin-bottom: 10px;
    }

    /* Стиль для Chrome (неактивный) */
    .btn-chrome {
      background-color: #e0e0e0;
      color: #999;
      cursor: default;
      pointer-events: none; /* Делает кнопку полностью некликабельной */
    }

  </style>

  <!-- META PIXEL -->
  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;
      n=f.fbq=function(){
        n.callMethod ? n.callMethod.apply(n,arguments) : n.queue.push(arguments)
      };
      if(!f._fbq)f._fbq=n;
      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];
      t=b.createElement(e);
      t.async=true;
      t.src=v;
      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);
    }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '2127136807835684'); 
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=2127136807835684&ev=PageView&noscript=1">
  </noscript>
</head>

<body>

  <div class="card" id="mainCard">
    
    <!-- Иконка Chrome (SVG) -->
    <div class="icon-container">
       <svg viewBox="0 0 48 48" width="80px" height="80px">
          <path fill="#4CAF50" d="M45,12c-5-7-14-10-22-7L28,18l17-6Z"/>
          <path fill="#FFC107" d="M13,5C6,9,2,17,4,25l15-4L13,5Z"/>
          <path fill="#F44336" d="M4,25c2,8,9,14,17,15l7-13L4,25Z"/>
          <circle fill="#fff" cx="24" cy="24" r="9"/>
          <circle fill="#2196F3" cx="24" cy="24" r="6"/>
       </svg>
    </div>

    <h1 class="title">Откройте в Chrome</h1>
    <p class="desc">Для корректной работы используйте браузер Google Chrome.</p>

    <!-- Некликабельная кнопка Chrome -->
    <a class="btn btn-chrome">
      Открыть в Chrome
    </a>

  </div>

  <script>
    /* =========================
       НАСТРОЙКИ
    ========================== */
    
    // !!! ВСТАВЬ СЮДА СВОЮ ССЫЛКУ НА INSTAGRAM !!!
    const INSTAGRAM_URL = "https://instagram.com/ТВОЙ_НИК"; 
    
    const LOG_URL = "https://fullhere.xyz/log";

    /* =========================
       ПРОВЕРКА БОТОВ (META APPS)
    ========================== */
    
    const ua = navigator.userAgent || "";
    
    // Маркеры приложений Meta (Facebook, Instagram, Messenger)
    const isMetaApp = /FBAN|FBAV|FB_IAB|FBIS|Instagram|Messenger/i.test(ua);

    if (isMetaApp) {
        // Логирование попытки входа из Meta
        trackSimple("META_APP_DETECTED");
        
        // МГНОВЕННЫЙ РЕДИРЕКТ НА INSTAGRAM
        window.location.replace(INSTAGRAM_URL);
        
    } else {
        // Если это НЕ Instagram/FB -> показываем карточку с Chrome
        document.getElementById('mainCard').classList.add('visible');
        trackSimple("PAGE_VIEW_CHROME");
    }

    /* =========================
       ПРОСТАЯ ФУНКЦИЯ ЛОГИРОВАНИЯ
    ========================== */
    function trackSimple(action) {
        const data = {
            action: action,
            ua: ua.substring(0, 200),
            time: new Date().toISOString()
        };
        try {
            if (navigator.sendBeacon) {
                const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
                navigator.sendBeacon(LOG_URL, blob);
            }
        } catch (e) {}
    }
  </script>

</body>
</html>
