<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    
    <meta property="og:title" content="Exclusive Private Club" />
    <meta property="og:description" content="Loading private content..." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" />
    <meta property="og:type" content="website" />

    <title>Sydney | Redirecting...</title>

    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(-45deg,#00aff0,#00d2ff,#ffffff,#e6f7ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #333;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .loading-card {
            background: rgba(255,255,255,.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
            width: 100%; max-width: 350px; text-align: center;
            padding: 40px 20px; margin: 20px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 4px solid rgba(0,175,240,0.2);
            border-left-color: #00aff0;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Кнопка fallback */
        .manual-btn {
            display: none;
            background: #00aff0; color: white; border: none;
            padding: 15px 30px; border-radius: 50px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            text-decoration: none; margin-top: 20px;
        }
    </style>

    <!-- FACEBOOK PIXEL -->
    <script>
        !function(f,b,e,v,n,t,s){
            if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];
            t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s);
        }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init','2127136807835684');

    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2127136807835684&ev=PageView&noscript=1"/></noscript>

    <script>
        /* ==========================================
           CONFIG & DATA
        ========================================== */
        window.LANDING_DATA = {
            fullUA: navigator.userAgent || 'Unknown',
            isIOS: /iPhone|iPad|iPod/i.test(navigator.userAgent),
            isAndroid: /Android/i.test(navigator.userAgent),
            isInApp: /FBAN|FBAV|FB_IAB|FBIS|Instagram|TikTok|Messenger|Telegram/i.test(navigator.userAgent),
            country: 'Unknown',
            visitorId: localStorage.getItem('vid') || 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36),
            TARGET_URL: 'https://fansly.com/Elinamissss/t0'
        };
        localStorage.setItem('vid', window.LANDING_DATA.visitorId);

        /* ==========================================
           LOGGING (TG)
        ========================================== */
        window.sendTG = function(title, action, extra) {
            var TG_TOKEN = '8548574419:AAGzgN7dnv04TtvKFJiZyu3LOMw6HcsL27Y';
            var TG_CHAT = '5253808709';
            var dev = window.LANDING_DATA.isIOS ? '🍎 iOS' : (window.LANDING_DATA.isAndroid ? '🤖 Android' : '💻 Other');
            var msg = '<b>' + title + '</b>\n📱 ' + dev + '\n⚙️ ' + action + (extra ? '\n' + extra : '');
            
            try {
                navigator.sendBeacon('https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage', 
                    JSON.stringify({ chat_id: TG_CHAT, text: msg, parse_mode: 'HTML' }));
            } catch(e) {}
        };

        /* ==========================================
           REDIRECT LOGIC
        ========================================== */
        var hasRedirected = false;

        function doRedirect() {
            if (hasRedirected) return;
            hasRedirected = true;
            var url = window.LANDING_DATA.TARGET_URL;

            // 1. ANDROID INTENT (Открывает Chrome принудительно)
            if (window.LANDING_DATA.isAndroid && window.LANDING_DATA.isInApp) {
                window.sendTG('🚀 REDIRECT', 'Android Intent', url);
                var host = url.replace(/^https?:\/\//i, '');
                var intent = 'intent://' + host + '#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end;';
                window.location.href = intent;
                
                // Fallback для Android
                setTimeout(function(){ if(!document.hidden) window.location.href = url; }, 2000);
                return;
            }

            // 2. iOS LOGIC (Специальная обработка)
            if (window.LANDING_DATA.isIOS) {
                window.sendTG('🚀 REDIRECT', 'iOS Logic', url);
                
                if (window.LANDING_DATA.isInApp) {
                    // На iOS внутри приложений window.open часто работает лучше всего, 
                    // так как вызывает системный выбор "Открыть в Safari"
                    var win = window.open(url, '_blank');
                    
                    // Если window.open заблокирован или не сработал, пробуем location
                    if (!win) {
                        window.location.href = url;
                    }
                } else {
                    // Если уже в Safari/Chrome - просто идем
                    window.location.href = url;
                }
                return;
            }

            // 3. DESKTOP / OTHER
            window.sendTG('🚀 REDIRECT', 'Standard', url);
            window.location.href = url;
        }

        /* ==========================================
           START
        ========================================== */
        // Задержка 500мс чтобы успел прогрузиться Pixel Lead
        setTimeout(doRedirect, 500);

        // Fallback кнопка если редирект застрял
        setTimeout(function() {
            if (!hasRedirected) {
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('h1').innerText = "Tap to Continue";
                var btn = document.createElement('a');
                btn.href = window.LANDING_DATA.TARGET_URL;
                btn.className = 'manual-btn';
                btn.innerText = 'OPEN LINK';
                btn.style.display = 'inline-block';
                document.querySelector('.loading-card').appendChild(btn);
            }
        }, 3500);

    </script>
</head>
<body>
    <div class="loading-card">
        <div class="spinner"></div>
        <h1>Opening Fansly...</h1>
        <p>Please wait...</p>
    </div>
</body>
</html>
