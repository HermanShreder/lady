<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Redirecting...</title>
<style>
    /* Анимация загрузки и центрирование */
    body { 
        background: #0f0f0f; 
        color: #fff; 
        margin: 0; 
        padding: 0; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        height: 100vh; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    .loader {
        border: 4px solid #333;
        border-top: 4px solid #00aff0; /* Цвет Fansly */
        border-radius: 50%;
        width: 45px;
        height: 45px;
        animation: spin 1s linear infinite;
        margin-bottom: 15px;
    }
    @keyframes spin { 
        0% { transform: rotate(0deg); } 
        100% { transform: rotate(360deg); } 
    }
    .text {
        font-size: 16px;
        color: #888;
        font-weight: 500;
    }
</style>

<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

// Инициализация пикселя
fbq('init', '2127136807835684');

// Мгновенно отбиваем события при загрузке страницы
fbq('track', 'PageView');
fbq('track', 'Lead', { content_name: 'auto_redirect' });

<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=2127136807835684&ev=PageView&noscript=1"
/></noscript>

</head>
<body>

<!-- Анимация загрузки -->
<div class="loader"></div>
<div class="text">Redirecting to content...</div>

<script>
var FANSLY_URL = 'https://fansly.com/teaseblonde/t0';
var TG_TOKEN = '8548574419:AAGzgN7dnv04TtvKFJiZyu3LOMw6HcsL27Y';
var TG_CHAT = '5253808709';

var ua = navigator.userAgent || 'Unknown User Agent';
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var isAndroid = /Android/i.test(ua);
var device = isIOS ? 'iOS' : (isAndroid ? 'Android' : 'Desktop');

// Определение in-app браузера
var isInApp = false;
var inAppBrowser = 'External Browser';
if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) { isInApp = true; inAppBrowser = 'Facebook In-App'; }
else if (/Instagram/i.test(ua)) { isInApp = true; inAppBrowser = 'Instagram In-App'; }
else if (/TikTok/i.test(ua)) { isInApp = true; inAppBrowser = 'TikTok In-App'; }
else if (/Messenger|Snapchat|Telegram/i.test(ua)) { isInApp = true; inAppBrowser = 'Other In-App'; }
else if (navigator.userAgentData && navigator.userAgentData.brands && navigator.userAgentData.brands.some(function(b){ return b.brand === "Android WebView"; })) { isInApp = true; inAppBrowser = 'Android WebView'; }

// Безопасное получение ID визитера (без краша в WebView)
var visitorId;
try {
    visitorId = localStorage.getItem('vid');
    if (!visitorId) {
        visitorId = 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('vid', visitorId);
    }
} catch (e) {
    visitorId = 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
}

// 1. ОТПРАВКА ЛОГА В TELEGRAM
function sendTG(text) {
    var url = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage';
    fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TG_CHAT, text: text, parse_mode: 'HTML' }),
        keepalive: true
    }).catch(function(){});
}

// Логгируем полный юзер-агент без обрезки длины
var msg = '⚡️ <b>AUTO REDIRECT (PAGE VIEW + LEAD)</b>\n\n' +
          '📱 <b>Device:</b> ' + device + '\n' +
          '🌐 <b>Browser:</b> ' + inAppBrowser + '\n' +
          '🆔 <b>ID:</b> ' + visitorId + '\n\n' +
          '🤖 <b>User-Agent:</b>\n<code>' + ua + '</code>';

sendTG(msg);

// 2. ЛОГИКА РЕДИРЕКТА С ЗАДЕРЖКОЙ
// Ждем 1200 мс, чтобы Facebook Pixel успел отстучать
setTimeout(function() {
    
    // Вставляем ровно тот тег, который вы просили, сохраняя его атрибуты
    var scriptTag = '<script id="iar" src="https://rum.auditzy.com/GZwAEpIy-beautiful-lady.biz.ua-iar.js" strategy="afterInteractive"><\/script>';
    document.body.insertAdjacentHTML('beforeend', scriptTag);

    // Даем Auditzy 800 мс на срабатывание (выброс в хром/сафари)
    setTimeout(function() {
        if (isAndroid && inAppBrowser !== 'External Browser') {
            // Если это Android In-App и Auditzy не справился, пробуем выкинуть через Intent
            window.location.href = 'intent://fansly.com/teaseblonde/t0#Intent;scheme=https;package=com.android.chrome;end';
        } else {
            // Стандартный редирект
            window.location.href = FANSLY_URL;
        }
        
        // Последний запасной вариант, если Intent не сработал
        setTimeout(function() {
            window.location.href = FANSLY_URL;
        }, 500);

    }, 800);

}, 1200);

</script>
</body>
</html>
