<!-- =========================================================
     BROWSER / DEVICE / VISITOR
     ========================================================= -->
<script>
(function(){
    var ua = navigator.userAgent || 'Unknown User Agent';
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);
    var device = isIOS ? 'iOS' : (isAndroid ? 'Android' : 'Desktop');
    var isInApp = /FBAN|FBAV|FB_IAB|FBIOS|Instagram|TikTok|Messenger|Snapchat|Telegram/i.test(ua);
    
    var browser = 'Unknown';
    if(/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)){ browser = 'Facebook In-App'; }
    else if(/Instagram/i.test(ua)){ browser = 'Instagram In-App'; }
    else if(/TikTok/i.test(ua)){ browser = 'TikTok In-App'; }
    else if(/Messenger|Snapchat|Telegram/i.test(ua)){ browser = 'Other In-App'; }
    else if(/EdgiOS|EdgA|Edg/i.test(ua)){ browser = 'Microsoft Edge'; }
    else if(/OPiOS|OPR/i.test(ua)){ browser = 'Opera'; }
    else if(/CriOS/i.test(ua)){ browser = 'Chrome iOS'; }
    else if(/Chrome/i.test(ua)){ browser = 'Google Chrome'; }
    else if(/FxiOS/i.test(ua)){ browser = 'Firefox iOS'; }
    else if(/Firefox/i.test(ua)){ browser = 'Firefox'; }
    else if(/Safari/i.test(ua)){ browser = 'Safari'; }

    var visitorId = localStorage.getItem('vid');
    if(!visitorId){
        visitorId = 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('vid', visitorId);
    }

    window.LANDING_UA = ua;
    window.LANDING_DEVICE = device;
    window.LANDING_BROWSER = browser;
    window.LANDING_IS_IN_APP = isInApp;
    window.LANDING_VISITOR_ID = visitorId;
})();
</script>
