<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Continue</title>

<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=true;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window,document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init','2127136807835684');
fbq('track', 'PageView');
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fff;color:#333;text-align:center;padding:20px}
.title{font-size:18px;font-weight:600;margin-bottom:24px;color:#333}
.btn{display:inline-block;padding:16px 32px;background:#00aff0;color:#fff;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 12px rgba(0,175,240,0.3);transition:transform 0.1s}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>

<div class="title">Tap to continue in browser</div>
<a id="openBtn" class="btn" href="/external.html">Open in Browser</a>

<script>
let visitorId = localStorage.getItem('visitor_id');
if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem('visitor_id', visitorId);
}

const VERSION = '2026-08-01-BRIDGE-GOOGLECHROME';
const EXTERNAL_URL = "/external.html?v=" + encodeURIComponent(visitorId);

var ua = navigator.userAgent || '';
var device = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : 'Desktop');

// Точная диагностика браузера
function detectBrowser(ua) {
    if (/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger/i.test(ua)) return 'facebook_inapp';
    if (/Telegram/i.test(ua)) return 'telegram';
    if (/Android/i.test(ua)) {
        if (/SamsungBrowser/i.test(ua)) return 'samsung_android';
        if (/EdgA/i.test(ua)) return 'edge_android';
        if (/OPR/i.test(ua)) return 'opera_android';
        if (/Firefox/i.test(ua)) return 'firefox_android';
        if (/Chrome/i.test(ua)) return 'chrome_android';
        return 'android_other';
    }
    if (/iPhone|iPad|iPod/i.test(ua)) {
        if (/CriOS/i.test(ua)) return 'chrome_ios';
        if (/FxiOS/i.test(ua)) return 'firefox_ios';
        if (/EdgiOS/i.test(ua)) return 'edge_ios';
        if (/Safari/i.test(ua)) return 'safari_ios';
        return 'ios_other';
    }
    if (/Chrome/i.test(ua)) return 'chrome_desktop';
    if (/Firefox/i.test(ua)) return 'firefox_desktop';
    if (/Safari/i.test(ua)) return 'safari_desktop';
    return 'other';
}

const currentBrowser = detectBrowser(ua);
var isFB = (currentBrowser === 'facebook_inapp');
const fullUaLog = "\nОпределен как: " + currentBrowser + "\nUA: " + ua;

function trackTG(action, details) {
    var d = new URLSearchParams({
        action: action,
        device: device,
        // Добавляем инфу о браузере в каждый лог, чтобы 100% видно было в ТГ
        details: (details || '') + fullUaLog, 
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language || '?',
        visitor: visitorId,
        page: 'bridge',
        version: VERSION,
        browser: currentBrowser,
        ua: ua
    });

    if (navigator.sendBeacon) navigator.sendBeacon('/api/track', d);
    else fetch('/api/track', { method: 'POST', body: d, keepalive: true }).catch(function(){});
}

// Отслеживаем, нажимал ли человек кнопку
let hasClicked = false;
let hasLoggedHidden = false;

// Логгируем факт сворачивания страницы (успешный вызов внешнего браузера)
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden' && hasClicked && !hasLoggedHidden) {
        hasLoggedHidden = true;
        trackTG('ВКЛАДКА_СВЕРНУТА_УСПЕХ', 'Окно свернулось в фон. Вероятно, открылся внешний браузер.');
    }
});

trackTG('BRIDGE_OPEN', 'Страница-прокладка открыта');

document.getElementById('openBtn').addEventListener('click', function(e) {
    e.preventDefault();
    hasClicked = true;

    if (typeof fbq === 'function') fbq('track', 'Lead', { content_name: 'bridge_click' });
    trackTG('LEAD_QUEUED', 'Событие пикселя поставлено в очередь');
    trackTG('BRIDGE_CLICK', 'Клик по кнопке');

    const fullExternalUrl = location.origin + EXTERNAL_URL;

    if (device === 'Android' && isFB) {
        // ANDROID: Выброс через Intent (НЕ ТРОГАЕМ, РАБОТАЕТ ОТЛИЧНО)
        trackTG('ПОПЫТКА_ПЕРЕХОДА', 'Метод: Android Intent');
        const intent = "intent://" + 
            fullExternalUrl.replace(/^https?:\/\//, "") + 
            "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + 
            encodeURIComponent(fullExternalUrl) + ";end";
        
        window.location.href = intent;

        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                trackTG('INTENT_BLOCKED_FALLBACK', 'Причина: In-App браузер заблокировал Intent. ПЕРЕВОД НА ФОЛЛ БЕК (открытие внутри FB)');
                window.location.href = fullExternalUrl;
            }
        }, 1500);

    } else if (device === 'iOS') {
        // iOS: Принудительный вызов Google Chrome для выхода из Meta IAB
        trackTG('IOS_GOOGLE_CHROME_ESCAPE', 'Метод: googlechrome://');
        
        // 1. Пытаемся вызвать Google Chrome напрямую
        window.location.href = "googlechrome://" + fullExternalUrl.replace(/^https?:\/\//, "");
        
        // 2. Страховка: если Chrome не установлен или вызов заблокирован, 
        // через небольшую задержку делаем обычный переход (он откроется в Safari, если это IAB)
        setTimeout(function() {
             if (document.visibilityState === 'visible') {
                 trackTG('IOS_CHROME_НЕТ_ОБЫЧНЫЙ_ПЕРЕХОД', 'Причина: Chrome не установлен или заблокирован. ПЕРЕВОД НА ФОЛЛ БЕК');
                 window.location.href = fullExternalUrl;
             }
        }, 500);

    } else {
        // Desktop или уже внешний браузер
        trackTG('ОБЫЧНЫЙ_ПЕРЕХОД', 'Браузер уже внешний или это Desktop. Обычный редирект.');
        window.location.href = fullExternalUrl;
    }
});
</script>
</body>
</html>
