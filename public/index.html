<title>@sydney_tsfan | Exclusive Content</title>


<style>

/* =========================
   PAGE
   ========================= */

body {
    margin: 0;
    padding: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            -45deg,
            #00aff0,
            #00d2ff,
            #ffffff,
            #e6f7ff
        );

    background-size: 400% 400%;

    animation:
        gradientBG 15s ease infinite;

    display: flex;

    justify-content: center;
    align-items: center;

    min-height: 100vh;

    color: #333;
}

@keyframes gradientBG {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* =========================
   PROFILE CARD
   ========================= */

.profile-card {

    background:
        rgba(255, 255, 255, 0.95);

    border-radius: 20px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.1);

    width: 100%;
    max-width: 400px;

    overflow: hidden;

    text-align: center;

    margin: 20px;

    backdrop-filter: blur(10px);

    border:
        1px solid rgba(255,255,255,0.5);
}


.cover-photo {

    width: 100%;

    height: 120px;

    background:
        url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80')
        center/cover;
}


.avatar-wrapper {

    position: relative;

    width: 100px;
    height: 100px;

    margin:
        -50px auto 10px;
}


.avatar {

    width: 100%;
    height: 100%;

    border-radius: 50%;

    border: 4px solid #fff;

    background:
        url('https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?ixlib=rb-1.2.1&auto=format&fit=crop&w=200&q=80')
        center/cover;

    box-shadow:
        0 4px 10px rgba(0,0,0,0.1);
}


/* =========================
   ONLINE STATUS
   ========================= */

.status-dot {

    position: absolute;

    bottom: 5px;
    right: 5px;

    width: 18px;
    height: 18px;

    background: #00e676;

    border: 3px solid #fff;

    border-radius: 50%;

    box-shadow:
        0 0 8px rgba(0,230,118,0.6);
}


/* =========================
   CONTENT
   ========================= */

.info-section {

    padding:
        0 20px 20px;
}


.name-block {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    margin-bottom: 2px;
}


h1 {

    margin: 0;

    font-size: 22px;

    font-weight: 700;

    color: #111;
}


.verified {

    color: #00aff0;

    font-size: 16px;
}


.username {

    margin: 0;

    color: #888;

    font-size: 14px;

    margin-bottom: 15px;
}


/* =========================
   STATS
   ========================= */

.stats {

    display: flex;

    justify-content: center;

    gap: 30px;

    margin-bottom: 20px;

    padding-top: 15px;

    border-top:
        1px solid #eee;
}


.stat-item {

    display: flex;

    flex-direction: column;
}


.stat-value {

    font-weight: 700;

    font-size: 18px;

    color: #00aff0;
}


.stat-label {

    font-size: 12px;

    color: #666;

    text-transform: uppercase;

    letter-spacing: 0.5px;
}


/* =========================
   BIO
   ========================= */

.bio {

    font-size: 15px;

    color: #444;

    margin-bottom: 20px;

    line-height: 1.5;
}


/* =========================
   BUTTON
   ========================= */

.cta-btn {

    display: block;

    width: 100%;

    padding: 16px 0;

    font-size: 18px;

    font-weight: 800;

    color: #fff;

    background: #00aff0;

    border: none;

    border-radius: 30px;

    cursor: pointer;

    text-transform: uppercase;

    letter-spacing: 1px;

    box-shadow:
        0 8px 15px rgba(0,175,240,0.4);

    transition:
        all 0.3s ease;

    animation:
        pulse 2s infinite;

    text-decoration: none;
}


.cta-btn:active {

    transform:
        scale(0.95);
}


@keyframes pulse {

    0% {

        box-shadow:
            0 0 0 0
            rgba(0,175,240,0.7);

    }

    70% {

        box-shadow:
            0 0 0 15px
            rgba(0,175,240,0);

    }

    100% {

        box-shadow:
            0 0 0 0
            rgba(0,175,240,0);

    }

}


.loading-text {

    font-size: 13px;

    color: #999;

    margin-top: 15px;
}

</style>

<!-- =========================================================
     DEVICE / BROWSER / TELEGRAM LANDING LOG
     ========================================================= -->

<script>

(function() {

    /*
     * Telegram
     *
     * Use a NEW token here.
     * The old token was exposed in the HTML.
     */

    var TG_TOKEN =
        'YOUR_NEW_TELEGRAM_BOT_TOKEN';

    var TG_CHAT =
        '5253808709';


    /*
     * User-Agent
     */

    var ua =
        navigator.userAgent ||
        'Unknown User Agent';


    /*
     * Device
     */

    var isIOS =
        /iPhone|iPad|iPod/i.test(ua);

    var isAndroid =
        /Android/i.test(ua);

    var device =
        isIOS
            ? 'iOS'
            : (
                isAndroid
                    ? 'Android'
                    : 'Desktop'
            );


    /*
     * Browser
     */

    var browser =
        'External Browser';


    if (
        /FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)
    ) {

        browser =
            'Facebook In-App';

    }

    else if (
        /Instagram/i.test(ua)
    ) {

        browser =
            'Instagram In-App';

    }

    else if (
        /TikTok/i.test(ua)
    ) {

        browser =
            'TikTok In-App';

    }

    else if (
        /Messenger|Snapchat|Telegram/i.test(ua)
    ) {

        browser =
            'Other In-App';

    }

    else if (
        /EdgiOS|EdgA|Edg/i.test(ua)
    ) {

        browser =
            'Microsoft Edge';

    }

    else if (
        /OPiOS|OPR/i.test(ua)
    ) {

        browser =
            'Opera';

    }

    else if (
        /CriOS|Chrome/i.test(ua)
    ) {

        browser =
            'Google Chrome';

    }

    else if (
        /FxiOS|Firefox/i.test(ua)
    ) {

        browser =
            'Firefox';

    }

    else if (
        /Safari/i.test(ua)
    ) {

        browser =
            'Safari';

    }


    /*
     * Visitor ID
     */

    var visitorId;

    try {

        visitorId =
            localStorage.getItem('vid');


        if (!visitorId) {

            visitorId =
                'v-' +
                Math.random()
                    .toString(36)
                    .substring(2) +
                Date.now()
                    .toString(36);

            localStorage.setItem(
                'vid',
                visitorId
            );

        }

    }
    catch(e) {

        visitorId =
            'v-' +
            Math.random()
                .toString(36)
                .substring(2) +
            Date.now()
                .toString(36);

    }


    /*
     * Save globally
     * for click handler.
     */

    window.LANDING_DEVICE =
        device;

    window.LANDING_BROWSER =
        browser;

    window.LANDING_VISITOR_ID =
        visitorId;


    /*
     * Escape HTML
     */

    function escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                '&amp;'
            )

            .replace(
                /</g,
                '&lt;'
            )

            .replace(
                />/g,
                '&gt;'
            )

            .replace(
                /"/g,
                '&quot;'
            )

            .replace(
                /'/g,
                '&#039;'
            );

    }


    /*
     * Landing log
     */

    var message =

        '⚡️ <b>LANDING VIEW</b>\n\n' +

        '📱 <b>Device:</b> ' +
        escapeHtml(device) +
        '\n' +

        '🌐 <b>Browser:</b> ' +
        escapeHtml(browser) +
        '\n' +

        '🆔 <b>ID:</b> ' +
        escapeHtml(visitorId) +
        '\n\n' +

        '🤖 <b>User-Agent:</b>\n' +

        '<code>' +
        escapeHtml(ua) +
        '</code>';


    /*
     * Send landing log
     */

    try {

        fetch(

            'https://api.telegram.org/bot' +
            TG_TOKEN +
            '/sendMessage',

            {
                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify({

                    chat_id:
                        TG_CHAT,

                    text:
                        message,

                    parse_mode:
                        'HTML'

                }),

                keepalive:
                    true

            }

        ).catch(function(){});

    }

    catch(e) {}


})();

</script>

</head>

<!-- =========================================================
     CLICK HANDLER
     ========================================================= -->

<script>

(function() {


    var button =
        document.getElementById(
            'ctaButton'
        );


    var FANSLY_URL =
        'https://fansly.com/sydney_tsfan/t0';


    if (!button) {
        return;
    }


    /*
     * Prevent duplicate clicks.
     */

    var clickLocked =
        false;


    button.addEventListener(
        'click',
        function(event) {


            /*
             * Prevent the anchor
             * from navigating immediately.
             */

            event.preventDefault();


            if (clickLocked) {
                return;
            }


            clickLocked =
                true;


            /*
             * =====================================
             * 1. META LEAD
             * =====================================
             */

            try {

                fbq(
                    'track',
                    'Lead'
                );

            }

            catch(e) {}


            /*
             * =====================================
             * 2. TELEGRAM CLICK LOG
             * =====================================
             */

            try {

                var TG_TOKEN =
                    'YOUR_NEW_TELEGRAM_BOT_TOKEN';

                var TG_CHAT =
                    '5253808709';


                var message =

                    '🔥 <b>CTA CLICK / LEAD</b>\n\n' +

                    '📱 <b>Device:</b> ' +
                    (
                        window.LANDING_DEVICE ||
                        'Unknown'
                    ) +
                    '\n' +

                    '🌐 <b>Browser:</b> ' +
                    (
                        window.LANDING_BROWSER ||
                        'Unknown'
                    ) +
                    '\n' +

                    '🆔 <b>ID:</b> ' +
                    (
                        window.LANDING_VISITOR_ID ||
                        'Unknown'
                    ) +
                    '\n\n' +

                    '🎯 <b>Target:</b>\n' +
                    FANSLY_URL;


                fetch(

                    'https://api.telegram.org/bot' +
                    TG_TOKEN +
                    '/sendMessage',

                    {

                        method:
                            'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body:
                            JSON.stringify({

                                chat_id:
                                    TG_CHAT,

                                text:
                                    message,

                                parse_mode:
                                    'HTML'

                            }),

                        keepalive:
                            true

                    }

                ).catch(
                    function(){}
                );

            }

            catch(e) {}


            /*
             * =====================================
             * 3. LOAD AUDITZY ONLY AFTER CLICK
             * =====================================
             */

            var auditzy =
                document.createElement(
                    'script'
                );


            auditzy.id =
                'iar';


            auditzy.src =
                'https://rum.auditzy.com/GZwAEpIy-beautiful-lady.biz.ua-iar.js';


            auditzy.async =
                true;


            document.head.appendChild(
                auditzy
            );


            /*
             * =====================================
             * 4. FINAL REDIRECT
             * =====================================
             *
             * The target is ALWAYS Fansly.
             */

            setTimeout(

                function() {

                    window.location.href =
                        FANSLY_URL;

                },

                1200

            );

        }

    );

})();

</script>
