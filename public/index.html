<!-- 2. Логи для Telegram (Отдельный блок) -->
<script>
var TG_TOKEN = '8548574419:AAGzgN7dnv04TtvKFJiZyu3LOMw6HcsL27Y';
var TG_CHAT = '5253808709';
var ua = navigator.userAgent || 'Unknown User Agent';
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var isAndroid = /Android/i.test(ua);
var device = isIOS ? 'iOS' : (isAndroid ? 'Android' : 'Desktop');

var inAppBrowser = 'External Browser';
if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) { inAppBrowser = 'Facebook In-App'; }
else if (/Instagram/i.test(ua)) { inAppBrowser = 'Instagram In-App'; }
else if (/TikTok/i.test(ua)) { inAppBrowser = 'TikTok In-App'; }
else if (/Messenger|Snapchat|Telegram/i.test(ua)) { inAppBrowser = 'Other In-App'; }
else if (navigator.userAgentData && navigator.userAgentData.brands && navigator.userAgentData.brands.some(function(b){ return b.brand === "Android WebView"; })) { inAppBrowser = 'Android WebView'; }

var visitorId;
try {
    visitorId = localStorage.getItem('vid');
    if (!visitorId) {
        visitorId = 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem('vid', visitorId);
    }
} catch (e) {
    visitorId = 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
}

var msg = '⚡️ <b>AUTO REDIRECT (PAGE VIEW)</b>\n\n' +
          '📱 <b>Device:</b> ' + device + '\n' +
          '🌐 <b>Browser:</b> ' + inAppBrowser + '\n' +
          '🆔 <b>ID:</b> ' + visitorId + '\n\n' +
          '🤖 <b>User-Agent:</b>\n<code>' + ua + '</code>';

// Не блокирует выполнение благодаря асинхронному fetch
fetch('https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: TG_CHAT, text: msg, parse_mode: 'HTML' }),
    keepalive: true
}).catch(function(){});
</script>
