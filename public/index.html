<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fff;color:#333;text-align:center;padding:20px}
.title{font-size:18px;font-weight:600;margin-bottom:24px;color:#333}
.btn{display:inline-block;padding:16px 32px;background:#00aff0;color:#fff;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 12px rgba(0,175,240,0.3);transition:transform 0.1s}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>

<div class="title">Tap to continue in browser</div>
<a id="openBtn" class="btn" href="https://fansly.com/mommy_ashley_ts/t1">Open in Browser</a>

<!-- Подключаем библиотеку для определения InApp браузеров -->
<script src="https://unpkg.com/@jhrunning/inappbrowserescaper/dist/browser/inappbrowserescaper.js"></script>

<script>
// Ваша целевая ссылка
const TARGET_URL = "https://fansly.com/mommy_ashley_ts/t1"; 

// 1. Инициализация visitorId для логов
let visitorId = localStorage.getItem('visitor_id');
if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem('visitor_id', visitorId);
}

// 2. Определение окружения
var ua = navigator.userAgent || '';
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var isAndroid = /Android/i.test(ua);
var device = isIOS ? 'iOS' : (isAndroid ? 'Android' : 'Desktop');

// 3. Функция трекинга (Теперь передает User-Agent во всех запросах)
function trackTG(action, details) {
    var d = new URLSearchParams({
        action: action,
        device: device,
        details: details || '',
        user_agent: ua, // <--- Добавлен User-Agent для логов
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language || '?',
        visitor: visitorId,
        page: 'bridge',
        version: '2026-08-01-BRIDGE-FINAL'
    });

    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', d);
    } else {
        fetch('/api/track', { method: 'POST', body: d, keepalive: true }).catch(function(){});
    }
}

// 4. ГЛАВНАЯ ФУНКЦИЯ ВЫБРОСА ВО ВНЕШНИЙ БРАУЗЕР
function forceExternalRedirect() {
    // Логируем сам факт старта перенаправления и еще раз передаем UA в details
    trackTG('REDIRECT_INITIATED', 'Targeting external browser. UA: ' + ua);

    if (isAndroid) {
        // Android: Выкидываем принудительно в Chrome через Intent
        const intent = "intent://" + 
            TARGET_URL.replace(/^https?:\/\//, "") + 
            "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + 
            encodeURIComponent(TARGET_URL) + ";end";
        window.location.href = intent;

        // Страховка на случай отсутствия Chrome
        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                trackTG('REDIRECT_FALLBACK_TRIGGERED');
                window.location.href = TARGET_URL; 
            }
        }, 1500);

    } else if (isIOS) {
        // iOS: Пытаемся открыть приложение Chrome, если его нет - через полсекунды открываем Safari
        window.location.href = "googlechrome://" + TARGET_URL.replace(/^https?:\/\//, "");
        setTimeout(() => {
             window.location.href = TARGET_URL;
        }, 500);
    } else {
        // ПК или другие устройства
        window.location.href = TARGET_URL;
    }
}

// 5. ЛОГИРОВАНИЕ ПРИ ЗАГРУЗКЕ
window.addEventListener('load', function() {
    trackTG('PAGE_LOADED');
    
    var lib = window.InAppBrowserEscaper;
    var Det = lib ? lib.InAppBrowserDetector : null;

    if (Det && Det.isInAppBrowser()) {
        trackTG('INAPP_DETECTED', Det.analyze().appName || 'Unknown');
    } else {
        trackTG('NORMAL_BROWSER_DETECTED');
    }
});

// 6. ОБРАБОТКА КЛИКА ПО КНОПКЕ
document.getElementById('openBtn').addEventListener('click', function(e) {
    e.preventDefault(); 

    // Отправляем чистый лид в FB Pixel
    if (typeof fbq === 'function') {
        fbq('track', 'Lead');
    }
    
    // Логируем клик для вашей статистики
    trackTG('BUTTON_CLICKED');

    // Запускаем функцию выброса
    forceExternalRedirect();
});
</script>
</body>
</html>
