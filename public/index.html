<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Exclusive Access</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0f0f0f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}

.container {
    width: 100%;
    max-width: 320px;
    text-align: center;
}

.title {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #FF9500, #FFCC00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 30px;
}

.btn-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.external-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    color: #fff;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: transform 0.1s, box-shadow 0.2s;
    background: linear-gradient(135deg, #FF9500, #FFCC00);
    box-shadow: 0 4px 20px rgba(255, 149, 0, 0.4);
}

.external-btn:active {
    transform: scale(0.96);
}

.external-btn svg {
    width: 20px;
    height: 20px;
    fill: #fff;
}

.status {
    margin-top: 20px;
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div class="container">
    <div class="title">Private Content 🔞</div>
    <div class="subtitle">Tap the button below to continue</div>
    
    <div class="btn-wrap" id="btnWrap">
        <!-- Кнопка будет добавлена скриптом -->
    </div>
    
    <div class="status" id="status"></div>
</div>

<!-- Meta Pixel Code -->

<script>
/* ==========================================
   CONFIGURATION
========================================== */
var FANSLY_URL = 'https://fansly.com/Elinamissss/t0'; // ТВОЯ ССЫЛКА
var TG_TOKEN = '8875182169:AAH-EYO8mDSgFJUhJXcpRAcN5u0xWyqqG9M';
var TG_CHAT = '5253808709';

/* ==========================================
   DETECTION & STATS
========================================== */
var ua = navigator.userAgent || '';
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var isAndroid = /Android/i.test(ua);
var device = isIOS ? 'iOS' : (isAndroid ? 'Android' : 'Desktop');

var isInApp = false;
var inAppBrowser = 'External Browser';
if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) { isInApp = true; inAppBrowser = 'Facebook In-App'; }
else if (/Instagram/i.test(ua)) { isInApp = true; inAppBrowser = 'Instagram In-App'; }
else if (/Messenger/i.test(ua)) { isInApp = true; inAppBrowser = 'Messenger In-App'; }
else if (/TikTok/i.test(ua)) { isInApp = true; inAppBrowser = 'TikTok In-App'; }
else if (/Telegram/i.test(ua)) { isInApp = true; inAppBrowser = 'Telegram In-App'; }

var visitorId = localStorage.getItem('vid');
if (!visitorId) {
    visitorId = 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    try { localStorage.setItem('vid', visitorId); } catch(e) {}
}

var UV_KEY = '_sydney_uv';
var isUniqueVisit = false;
try { if (!localStorage.getItem(UV_KEY)) { localStorage.setItem(UV_KEY, '1'); isUniqueVisit = true; } } catch(e) {}
document.getElementById('status').textContent = isUniqueVisit ? '✦ new visit' : 'returning visitor';

/* ==========================================
   LOGGING FUNCTIONS
========================================== */
function sendTG(text) {
    var url = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage';
    var body = JSON.stringify({ chat_id: TG_CHAT, text: text, parse_mode: 'HTML' });
    if (navigator.sendBeacon) {
        navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }));
    } else {
        fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(function(){});
    }
}

function logEvent(action, extra) {
    var msg = '🔔 <b>' + action + '</b>\n\n' +
        '📱 ' + device + ' | 🌐 ' + inAppBrowser + '\n' +
        '🆔 ' + visitorId.substring(0, 8) + '...\n' +
        '🕐 ' + new Date().toISOString().slice(0, 19);
    if (extra) msg += '\n📝 ' + extra;
    sendTG(msg);
}

logEvent(isUniqueVisit ? 'UNIQUE_VISIT' : 'RETURN_VISIT', 'InApp: ' + isInApp);

var chromeIcon = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>';

function fireLead(source) {
    if (typeof fbq === 'function') {
        fbq('track', 'Lead', { content_name: 'fansly_redirect', source: source });
    }
}

/* ==========================================
   REDIRECT LOGIC
========================================== */
function doRedirect(source) {
    fireLead(source);
    logEvent('REDIRECT_TRIGGERED', source);

    if (device === 'Android') {
        // Android Intent для открытия Chrome
        var cleanUrl = FANSLY_URL.replace("https://", "").replace("http://", "");
        var intent = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(FANSLY_URL) + ";end";
        window.location.href = intent;
        
        // Fallback если intent не сработал
        setTimeout(function() {
            if (document.visibilityState === 'visible') window.location.href = FANSLY_URL;
        }, 2000);

    } else if (device === 'iOS') {
        // iOS открываем в новой вкладке (Safari/Chrome)
        window.open(FANSLY_URL, '_blank');
        
    } else {
        // Desktop
        window.location.replace(FANSLY_URL);
    }
}

/* ==========================================
   BUTTON GENERATION
========================================== */
var wrap = document.getElementById('btnWrap');

// Создаем одну универсальную кнопку
var btn = document.createElement('button');
btn.className = 'external-btn';
btn.innerHTML = chromeIcon + ' Open in Chrome';

btn.addEventListener('click', function(e) {
    e.preventDefault();
    doRedirect('MAIN_BUTTON_CLICK');
});

wrap.appendChild(btn);

</script>
</body>
</html>
