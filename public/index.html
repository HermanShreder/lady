<style>
body {
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(-45deg,#00aff0,#00d2ff,#ffffff,#e6f7ff);
    background-size:400% 400%;
    animation:gradientBG 15s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:#333
}

@keyframes gradientBG {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.loading-card {
    background:rgba(255,255,255,.95);
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
    width:100%;
    max-width:350px;
    text-align:center;
    padding:40px 20px;
    margin:20px;
    border:1px solid rgba(255,255,255,.5);
    backdrop-filter:blur(10px)
}

.spinner {
    border:4px solid rgba(0,175,240,0.2);
    border-left-color:#00aff0;
    border-radius:50%;
    width:50px;
    height:50px;
    animation:spin 1s linear infinite;
    margin:0 auto 20px
}

@keyframes spin {
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
}

h1 {
    margin:0 0 10px;
    font-size:20px;
    font-weight:700;
    color:#111
}

p {
    font-size:15px;
    color:#666;
    margin:0
}
</style>

<!-- FB PIXEL -->

    };
    if(!f._fbq)f._fbq=n;
    n.push=n;

<script>
window.LANDING_DATA = {
    fullUA: navigator.userAgent || 'Unknown',

    isIOS: /iPhone|iPad|iPod/i.test(navigator.userAgent),

    isAndroid: /Android/i.test(navigator.userAgent),

    isInApp: /FBAN|FBAV|FB_IAB|FBIOS|Instagram|TikTok|Messenger|Telegram/i.test(
        navigator.userAgent
    ),

    country: 'Loading...',

    visitorId:
        localStorage.getItem('vid') ||
        'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36),

    /*
     * ОСНОВНАЯ ССЫЛКА
     */
    FANSLY_URL: 'https://fansly.com/Elinamissss/t0'
};

localStorage.setItem(
    'vid',
    window.LANDING_DATA.visitorId
);

function sanitizeUA(str) {
    return str
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
}

window.STATS = {
    totalVisits:0,
    uniqueVisits:0,
    iosVisits:0,
    androidVisits:0,
    inAppVisits:0,
    externalVisits:0,
    clicks:0,
    redirects:0,
    countries:{},
    visitors:{},
    startTime:Date.now()
};

var savedStats = localStorage.getItem('landing_stats');

if(savedStats) {
    try {
        var p = JSON.parse(savedStats);

        if(Date.now() - p.startTime < 600000) {
            window.STATS = p;
        }
    } catch(e) {}
}

function saveStats() {
    try {
        localStorage.setItem(
            'landing_stats',
            JSON.stringify(window.STATS)
        );
    } catch(e) {}
}

function inc(k) {
    window.STATS[k] = (window.STATS[k] || 0) + 1;
    saveStats();
}


/*
 * TELEGRAM LOG
 */
window.sendTG = function(title, action, extra) {

    var TG_TOKEN='8548574419:AAGzgN7dnv04TtvKFJiZyu3LOMw6HcsL27Y';
    var TG_CHAT='5253808709';

    var dev =
        window.LANDING_DATA.isIOS
            ? '🍎 iOS'
            : (
                window.LANDING_DATA.isAndroid
                    ? '🤖 Android'
                    : '💻 Other'
            );

    var br =
        window.LANDING_DATA.isInApp
            ? '🛑 In-App'
            : '✅ External';

    var msg =
        '<b>'+title+'</b>\n\n' +
        '🌍 <b>GEO:</b> '+window.LANDING_DATA.country+'\n' +
        '📱 <b>Device:</b> '+dev+'\n' +
        '🌐 <b>Browser:</b> '+br+'\n' +
        '🆔 <b>ID:</b> <code>'+
        window.LANDING_DATA.visitorId.substring(0,8)+
        '</code>\n';

    if(action) {
        msg += '\n⚙️ <b>Action:</b> '+action;
    }

    if(extra) {
        msg += '\n'+extra;
    }

    try {
        fetch(
            'https://api.telegram.org/bot'+
            TG_TOKEN+
            '/sendMessage',
            {
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({
                    chat_id:TG_CHAT,
                    text:msg,
                    parse_mode:'HTML'
                }),
                keepalive:true
            }
        ).catch(function(){});
    } catch(e) {}
};


/*
 * ПЕРИОДИЧЕСКАЯ СТАТИСТИКА
 */
setInterval(function() {

    var TG_TOKEN='8548574419:AAGzgN7dnv04TtvKFJiZyu3LOMw6HcsL27Y';
    var TG_CHAT='5253808709';

    var cl =
        Object.keys(window.STATS.countries)
        .map(function(c) {
            return c+': '+window.STATS.countries[c];
        })
        .join('\n') || 'Нет данных';

    var el =
        Math.round(
            (Date.now()-window.STATS.startTime)/60000
        );

    var msg =
        '📊 <b>Статистика за '+el+' мин</b>\n\n' +

        '👤 Всего: '+window.STATS.totalVisits+'\n' +
        '🆕 Уникальных: '+window.STATS.uniqueVisits+'\n\n' +

        '📱 iOS: '+window.STATS.iosVisits+
        ' | Android: '+window.STATS.androidVisits+'\n' +

        '🌐 In-App: '+window.STATS.inAppVisits+
        ' | External: '+window.STATS.externalVisits+'\n' +

        '🚀 Авто-Редиректов: '+window.STATS.redirects+'\n\n' +

        '🌍 Страны:\n'+cl+'\n\n' +

        '🕐 '+new Date().toISOString().slice(0,19);

    try {

        fetch(
            'https://api.telegram.org/bot'+
            TG_TOKEN+
            '/sendMessage',
            {
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({
                    chat_id:TG_CHAT,
                    text:msg,
                    parse_mode:'HTML'
                }),
                keepalive:true
            }
        ).catch(function(){});

    } catch(e) {}

    window.STATS = {
        totalVisits:0,
        uniqueVisits:0,
        iosVisits:0,
        androidVisits:0,
        inAppVisits:0,
        externalVisits:0,
        clicks:0,
        redirects:0,
        countries:{},
        visitors:{},
        startTime:Date.now()
    };

    saveStats();

},600000);
</script>

</head>

<body>

<div class="loading-card">

    <div class="spinner"></div>

    <h1>Opening Fansly...</h1>

    <p>
        Please wait, you are being redirected securely.
    </p>

</div>


<script>

/*
 * СОБИРАЕМ СТАТИСТИКУ
 */

inc('totalVisits');

if(window.LANDING_DATA.isIOS) {
    inc('iosVisits');
}

if(window.LANDING_DATA.isAndroid) {
    inc('androidVisits');
}

if(window.LANDING_DATA.isInApp) {
    inc('inAppVisits');
} else {
    inc('externalVisits');
}

if(
    !window.STATS.visitors[
        window.LANDING_DATA.visitorId
    ]
) {

    window.STATS.visitors[
        window.LANDING_DATA.visitorId
    ] = 1;

    inc('uniqueVisits');
}


/*
 * РЕДИРЕКТ
 *
 * ВАЖНО:
 * Используется одна обычная HTTPS-ссылка.
 * Без intent://
 * Без googlechrome://
 * Без искусственных схем.
 */

var isRedirecting = false;

function executeRedirect() {

    if(isRedirecting) {
        return;
    }

    isRedirecting = true;

    inc('redirects');

    /*
     * Обычный переход на Fansly
     */
    window.location.replace(
        window.LANDING_DATA.FANSLY_URL
    );
}


/*
 * GEO
 */

fetch('/api/geo')

.then(function(r) {
    return r.json();
})

.then(function(data) {

    window.LANDING_DATA.country =
        data.country || 'Unknown';

    if(
        !window.STATS.countries[
            window.LANDING_DATA.country
        ]
    ) {

        window.STATS.countries[
            window.LANDING_DATA.country
        ] = 0;
    }

    window.STATS.countries[
        window.LANDING_DATA.country
    ]++;

    saveStats();


    var safeUA =
        sanitizeUA(
            window.LANDING_DATA.fullUA
        );


    var actionType =
        'Standard HTTPS Redirect';


    window.sendTG(
        '🚀 AUTO REDIRECT',
        actionType,
        '🕵️ <b>UA:</b>\n<code>'+
        safeUA+
        '</code>'
    );


    /*
     * Небольшая задержка только для отправки лога.
     * Сам переход обычный.
     */

    setTimeout(
        executeRedirect,
        200
    );

})

.catch(function() {

    /*
     * Если /api/geo не работает,
     * всё равно переходим на Fansly.
     */

    executeRedirect();

});


/*
 * Глобальный fallback.
 * Если GEO зависнет — переход максимум через 1 секунду.
 */

setTimeout(
    executeRedirect,
    1000
);

</script>

</body>
</html>
