<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Exclusive Content</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0f0f0f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{position:relative;width:100%;max-width:320px;aspect-ratio:9/14;border-radius:16px;overflow:hidden;background:#1a1a1a;box-shadow:0 15px 40px rgba(0,0,0,.7)}
.video-bg{position:absolute;inset:0;background:linear-gradient(180deg,#1a1a1a 0%,#2d1b3d 50%,#1a1a1a 100%);display:flex;align-items:center;justify-content:center}
.play-icon{width:56px;height:56px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);animation:pulse 2s infinite;cursor:pointer}
.play-icon svg{width:26px;height:26px;fill:#fff;margin-left:4px}
.overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,transparent 40%);display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.badge{position:absolute;top:12px;left:12px;background:rgba(255,59,48,.9);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;letter-spacing:.5px;text-transform:uppercase;z-index:5}
.title{font-size:17px;font-weight:700;margin-bottom:4px;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.subtitle{font-size:12px;color:rgba(255,255,255,.7)}
.btn-wrap{width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px}
.external-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;text-transform:uppercase;letter-spacing:.5px;transition:transform .1s}
.external-btn:active{transform:scale(.97)}
.external-btn svg{width:18px;height:18px;fill:#fff}
.btn-chrome{background:linear-gradient(135deg,#FF9500,#FFCC00);box-shadow:0 4px 16px rgba(255,149,0,.35)}
.btn-safari{background:linear-gradient(135deg,#007AFF,#5AC8FA);box-shadow:0 4px 16px rgba(0,122,255,.35)}
.status{margin-top:12px;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.5px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
</style>
</head>
<body>

<div class="card">
    <div class="video-bg">
        <div class="play-icon" id="playBtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
    <div class="badge">🔞 Exclusive</div>
    <div class="overlay">
        <div class="title">Mommy Ashley 🔥</div>
        <div class="subtitle">Full video • Tap to watch</div>
    </div>
</div>

<div class="btn-wrap" id="btnWrap"></div>
<div class="status" id="status"></div>

<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '2127136807835684');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=2127136807835684&ev=PageView&noscript=1"
/></noscript>
<!-- End Meta Pixel Code -->

<script>
var FANSLY_URL = 'https://fansly.com/mommy_ashley_ts/t1';
var TG_TOKEN = '8875182169:AAH-EYO8mDSgFJUhJXcpRAcN5u0xWyqqG9M';
var TG_CHAT = '5253808709';
var REDIRECT_DELAY = 1000;

var ua = navigator.userAgent || '';
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var isAndroid = /Android/i.test(ua);
var device = isIOS ? 'iOS' : (isAndroid ? 'Android' : 'Desktop');

var isInApp = false;
var inAppBrowser = 'External Browser';
if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) { isInApp = true; inAppBrowser = 'Facebook In-App'; }
else if (/Instagram/i.test(ua)) { isInApp = true; inAppBrowser = 'Instagram In-App'; }
else if (/Messenger/i.test(ua)) { isInApp = true; inAppBrowser = 'Messenger In-App'; }
else if (/TikTok/i.test(ua)) { isInApp = true; inAppBrowser = 'TikTok In-App'; }
else if (/Snapchat/i.test(ua)) { isInApp = true; inAppBrowser = 'Snapchat In-App'; }
else if (/Telegram/i.test(ua)) { isInApp = true; inAppBrowser = 'Telegram In-App'; }
else if (navigator.userAgentData && navigator.userAgentData.brands) {
    if (navigator.userAgentData.brands.some(function(b){ return b.brand === "Android WebView"; })) {
        isInApp = true; inAppBrowser = 'Android WebView';
    }
}

var visitorId = localStorage.getItem('vid');
if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    try { localStorage.setItem('vid', visitorId); } catch(e) {}
}

var UV_KEY = '_ash_uv';
var isUniqueVisit = false;
try { if (!localStorage.getItem(UV_KEY)) { localStorage.setItem(UV_KEY, '1'); isUniqueVisit = true; } } catch(e) {}
document.getElementById('status').textContent = isUniqueVisit ? '✦ new visit' : 'returning visitor';

function sendTG(text) {
    var url = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage';
    var body = JSON.stringify({ chat_id: TG_CHAT, text: text, parse_mode: 'HTML' });
    fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body,
        keepalive: true
    }).catch(function(){});
}

function logEvent(action, extra) {
    var msg = '🔔 <b>' + action + '</b>\n\n' +
        '📱 ' + device + ' | 🌐 ' + inAppBrowser + '\n' +
        '🆔 ' + visitorId.substring(0, 8) + '...\n' +
        '🕐 ' + new Date().toISOString().slice(0, 19);
    if (extra) msg += '\n📝 ' + extra;
    if (action === 'PAGE_LOAD') msg += '\n\n🤖 <code>' + ua.substring(0, 400) + '</code>';
    sendTG(msg);
}

logEvent(isUniqueVisit ? 'UNIQUE_VISIT' : 'RETURN_VISIT', 'InApp: ' + isInApp);

var chromeIcon = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>';
var safariIcon = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>';

// ====== ИЗМЕНЕНО: Теперь редиректим на external.html ======
function doRedirect(source, useChromeScheme) {
    // 1. Отправляем Lead в Meta Pixel
    if (typeof fbq === 'function') {
        fbq('track', 'Lead', { content_name: 'fansly_redirect', source: source });
    }

    // 2. Логируем в ТГ (что пользователь кликнул)
    logEvent('REDIRECT', source);

    // 3. Формируем URL для external.html с передачей всех данных
    var params = new URLSearchParams({
        url: FANSLY_URL,
        visitor: visitorId,
        device: device,
        prevBrowser: inAppBrowser,
        source: source,
        ua: ua
    });
    
    if (useChromeScheme) {
        params.append('useChromeScheme', '1');
    }

    // 4. Задержка 1000мс → редирект на external.html
    setTimeout(function() {
        window.location.href = 'external.html?' + params.toString();
    }, REDIRECT_DELAY);
}

// Клик по плееру
document.getElementById('playBtn').addEventListener('click', function() {
    doRedirect('PLAY_BUTTON');
});

var wrap = document.getElementById('btnWrap');

if (isAndroid) {
    var btn = document.createElement('button');
    btn.className = 'external-btn btn-chrome';
    btn.innerHTML = chromeIcon + ' Open in Chrome';
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        doRedirect('ANDROID_CHROME_BTN');
    });
    wrap.appendChild(btn);

} else if (isIOS) {
    var sBtn = document.createElement('button');
    sBtn.className = 'external-btn btn-safari';
    sBtn.innerHTML = safariIcon + ' Open in Safari';
    sBtn.addEventListener('click', function(e) {
        e.preventDefault();
        doRedirect('IOS_SAFARI_BTN');
    });
    wrap.appendChild(sBtn);

    var cBtn = document.createElement('button');
    cBtn.className = 'external-btn btn-chrome';
    cBtn.innerHTML = chromeIcon + ' Open in Chrome';
    cBtn.addEventListener('click', function(e) {
        e.preventDefault();
        // Для iOS Chrome передаём флаг useChromeScheme=true
        doRedirect('IOS_CHROME_BTN', true);
    });
    wrap.appendChild(cBtn);

} else {
    var dBtn = document.createElement('button');
    dBtn.className = 'external-btn btn-chrome';
    dBtn.innerHTML = chromeIcon + ' Watch Full Video';
    dBtn.addEventListener('click', function(e) {
        e.preventDefault();
        doRedirect('DESKTOP_BTN');
    });
    wrap.appendChild(dBtn);
}
</script>
</body>
</html>
