<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #fff;
    color: #333;
    text-align: center;
    padding: 20px;
}

.title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 24px;
    color: #333;
}

.btn {
    display: inline-block;
    padding: 16px 32px;
    background: #00aff0;
    color: #fff;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 4px 12px rgba(0,175,240,0.3);
    transition: transform 0.1s;
}

.btn:active {
    transform: scale(0.98);
}
</style>

</head>

<body>

<div class="title">Tap to continue in browser</div>

<a id="openBtn" class="btn">
    Open in Browser
</a>

<script>
let visitorId = localStorage.getItem('visitor_id');

if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);

    localStorage.setItem('visitor_id', visitorId);
}

const VERSION = '2026-08-01-BRIDGE-GOOGLECHROME-V2';

const EXTERNAL_URL = "/external.html?v=" + encodeURIComponent(visitorId);
const fullExternalUrl = location.origin + EXTERNAL_URL;

var ua = navigator.userAgent || '';

var device = /iPhone|iPad|iPod/i.test(ua)
        ? 'iOS'
        : (/Android/i.test(ua) ? 'Android' : 'Desktop');

var isFB =
    ua.includes("FBAN") ||
    ua.includes("FBAV") ||
    ua.includes("FB_IAB") ||
    ua.includes("FBIOS") ||
    ua.includes("Instagram") ||
    ua.includes("Messenger") ||
    ua.includes("wv");

function trackTG(action, details) {
    var d = new URLSearchParams({
        action: action,
        device: device,
        details: details || '',
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language || '?',
        visitor: visitorId,
        page: 'bridge',
        version: VERSION,
        browser: isFB ? 'inapp' : 'external'
    });

    // sendBeacon отлично подходит для событий, отправляемых прямо перед выгрузкой страницы
    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', d);
    } else {
        fetch('/api/track', {
            method: 'POST',
            body: d,
            keepalive: true
        }).catch(function(){});
    }
}

trackTG('BRIDGE_OPEN');

const openBtn = document.getElementById('openBtn');

// 1. ПРИ ЗАГРУЗКЕ СТРАНИЦЫ: Формируем правильный href для кнопки
if (device === 'Android' && isFB) {
    // Нативный Intent для Android. 
    // S.browser_fallback_url берёт на себя всю работу, если Chrome не открылся.
    const intentUrl = 
        'intent://' + 
        fullExternalUrl.replace(/^https?:\/\//, '') + 
        '#Intent;' +
        'scheme=https;' +
        'action=android.intent.action.VIEW;' +
        'category=android.intent.category.BROWSABLE;' +
        'package=com.android.chrome;' +
        'S.browser_fallback_url=' + encodeURIComponent(fullExternalUrl) + 
        ';end';
        
    openBtn.href = intentUrl;
} else {
    // Базовый fallback URL для Desktop и iOS
    openBtn.href = fullExternalUrl;
}


// 2. ОБРАБОТЧИК КЛИКА: Отправка событий и контроль перехода
openBtn.addEventListener('click', function(e) {
    
    // Пиксель отправляем всегда при клике
    if (typeof fbq === 'function') {
        fbq('track', 'Lead', {
            content_name: 'bridge_click'
        });
    }

    trackTG('LEAD_QUEUED');
    trackTG('BRIDGE_CLICK');

    if (device === 'Android' && isFB) {
        
        // ВАЖНО: Мы НЕ делаем e.preventDefault() здесь!
        // Android расценит это как прямой физический клик пользователя по intent://
        // Трекинг fbq и trackTG всё равно успеет уйти, так как intent 
        // обычно ставит текущую вкладку на паузу (уводит в фон), а не убивает сразу.
        
        trackTG('ANDROID_INTENT');
        
    } else if (device === 'iOS') {
        
        // Для iOS блокируем дефолтный переход, так как у googlechrome:// 
        // нет нативного fallback параметра. 
        e.preventDefault();
        
        trackTG('IOS_GOOGLE_CHROME_ESCAPE');
        window.location.href = "googlechrome://" + fullExternalUrl.replace(/^https?:\/\//, "");

        // Если Chrome на iOS не установлен, через 800мс просто откроем внешний сайт в текущем браузере
        setTimeout(function() {
            window.location.href = fullExternalUrl;
        }, 800);

    } else {
        
        // Desktop или уже внешний браузер
        // Делаем preventDefault и задержку, чтобы Пиксель гарантированно успел отправить событие
        e.preventDefault();
        trackTG('DESKTOP_DIRECT_REDIRECT');
        
        setTimeout(function() {
            window.location.href = fullExternalUrl;
        }, 800);
    }
});
</script>

</body>
</html>
