<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  
  <!-- OPEN GRAPH ТЕГИ ДЛЯ ИДЕАЛЬНОГО ПРЕВЬЮ В FACEBOOK -->
  <meta property="og:title" content="Официальный Telegram Канал" />
  <meta property="og:description" content="Нажмите, чтобы присоединиться к нашему сообществу в Telegram." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" />
  <meta property="og:type" content="website" />

  <title>Mila Noir | Telegram</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f4f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #000; }
    .tg-card { background: #ffffff; max-width: 400px; width: 90%; border-radius: 12px; padding: 40px 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .tg-avatar { width: 80px; height: 80px; background-color: #3390ec; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
    .tg-title { font-size: 22px; font-weight: 600; margin-bottom: 10px; color: #000; }
    .tg-desc { font-size: 15px; color: #707579; margin-bottom: 24px; line-height: 1.4; }
    .btn { display: block; width: 100%; background-color: #3390ec; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 14px 20px; border-radius: 8px; transition: background-color 0.2s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
    .btn:hover { background-color: #2a7bcf; }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  
  <div class="tg-card">
    <div class="tg-avatar">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    
    <h1 class="tg-title">Официальный Канал</h1>
    <p class="tg-desc">
      Нажмите кнопку ниже, чтобы продолжить просмотр в официальном Telegram-канале.
    </p>

    <a id="openBtn" class="btn" href="https://t.me/+Wp9sT1rqpWoyNjcy">
      Открыть в Telegram
    </a>
  </div>

</body>
</html>
