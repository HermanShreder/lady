
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading...</title>
<style>
body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#333}
.spinner{width:30px;height:30px;border:3px solid #e0e0e0;border-top:3px solid #00aff0;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:none; margin-top:30px; padding:16px 32px; background:#00aff0; color:#fff; text-decoration:none; border-radius:25px; font-size:16px; font-weight:600; box-shadow:0 4px 12px rgba(0,175,240,0.3); cursor: pointer;}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>

<div class="spinner" id="spinner"></div>

<!-- Кнопка-фоллбек -->
<a id="openBtn" class="btn" href="#">Open Chat</a>

<script>
// --- КОНФИГУРАЦИЯ ---
const TG_USERNAME = 'frgnoo';
const PREFILL_MSG = 'Здравствуйте я из рекламы фб,меня интересует онлайн заработок';

// Формируем ссылки
const encodedMsg = encodeURIComponent(PREFILL_MSG);

// ЕДИНАЯ ПРАВИЛЬНАЯ ССЫЛКА для открытия чата с текстом.
// Внешний браузер (Chrome/Safari) отлично передает это в приложение Telegram.
const tgUrl = `https://t.me/${TG_USERNAME}?text=${encodedMsg}`;

// Устанавливаем ссылку для кнопки сразу
document.getElementById('openBtn').href = tgUrl;

const params = new URLSearchParams(location.search);
const visitorId = params.get('v') || localStorage.getItem('visitor_id') || 'unknown';

const ua = navigator.userAgent || '';
const device = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : 'Desktop');

// Сбор данных об окружении
const envData = {
    ua: ua,
    userAgentData: navigator.userAgentData ? { brands: navigator.userAgentData.brands, platform: navigator.userAgentData.platform, mobile: navigator.userAgentData.mobile } : null,
    vendor: navigator.vendor,
    platform: navigator.platform,
    language: navigator.language,
    referrer: document.referrer,
    currentUrl: window.location.href,
    screen: { width: screen.width, height: screen.height },
    cookieEnabled: navigator.cookieEnabled,
    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
};

const browser = /Telegram/i.test(ua) ? "telegram" :
                /FBAN|FBAV|FB_IAB|Instagram|Messenger/i.test(ua) ? "facebook" :
                /CriOS|Chrome/i.test(ua) ? "chrome" :
                /Safari/i.test(ua) ? "safari" : "other";

// --- ИСПРАВЛЕННАЯ ФУНКЦИЯ ЛОГИРОВАНИЯ ---
function trackTG(action, details) {
    const body = new URLSearchParams({
        action: action,
        device: device,
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language || '?',
        browser: browser,
        details: details || '',
        visitor: visitorId,
        page: 'external_tg_msg',
        version: '2026-08-03-TG-MSG-LOGS-FIXED'
    });

    // sendBeacon создан специально для отправки данных при уходе со страницы.
    // Но даже ему нужно несколько миллисекунд на инициацию.
    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', body);
    } else {
        fetch('/api/track', { method: 'POST', body: body, keepalive: true }).catch(()=>{});
    }
}

let fallbackTimer;

function setupFallbackButton() {
    document.getElementById('spinner').style.display = 'none';
    const btn = document.getElementById('openBtn');
    btn.style.display = 'block';
    
    // Аналитика при клике с гарантированной отправкой
    btn.addEventListener('click', function(e) {
        e.preventDefault(); // Останавливаем мгновенный переход
        trackTG('MANUAL_FALLBACK_CLICK');
        
        // Даем 300мс на отправку лога, затем переходим
        setTimeout(function() {
            window.location.href = tgUrl;
        }, 300);
    });
}

// Отмена таймера если страница начала выгружаться (значит редирект сработал)
window.addEventListener('pagehide', function() {
    clearTimeout(fallbackTimer);
});

// --- ИСПРАВЛЕННАЯ ЛОГИКА ЗАПУСКА ---
if (device === 'iOS' || device === 'Android') {
    // 1. Сначала отправляем логи
    trackTG('EXTERNAL_PAGE_LOADED', JSON.stringify(envData));
    trackTG('TG_MSG_UNIVERSAL_LINK_START');

    // 2. КРИТИЧЕСКИ ВАЖНО: Даем браузеру 400мс на реальную отправку запроса 
    // перед тем, как мы вызовем window.location.href и обрвем соединение.
    setTimeout(function() {
        window.location.href = tgUrl;
    }, 400);

    // 3. ФАЛЛБЕК: Увеличили время до 3000мс, чтобы учесть задержку выше
    fallbackTimer = setTimeout(function() {
        if (document.visibilityState === 'visible') {
            trackTG('TG_LINK_FAILED_SHOW_BUTTON');
            setupFallbackButton();
        }
    }, 3000);

} else {
    // Desktop: просто редирект на веб-версию с текстом
    trackTG('EXTERNAL_PAGE_LOADED', JSON.stringify(envData));
    trackTG('DESKTOP_REDIRECT_START');
    
    setTimeout(function() {
        window.location.replace(tgUrl);
    }, 400);
}
</script>
</body>
</html>
