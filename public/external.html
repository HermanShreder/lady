<body>

<script>
var TG_TOKEN = '8875182169:AAH-EYO8mDSgFJUhJXcpRAcN5u0xWyqqG9M';
var TG_CHAT = '5253808709';

// 1. Получаем параметры из URL
var params = new URLSearchParams(window.location.search);
var finalUrl = params.get('url');
var visitorId = params.get('visitor') || localStorage.getItem('vid') || 'unknown';
var prevBrowser = params.get('prevBrowser') || 'unknown';
var source = params.get('source') || 'unknown';
var prevUa = params.get('ua') || '';
var useChromeScheme = params.get('useChromeScheme') === '1';

// 2. Определяем текущее окружение (уже внешний браузер)
var ua = navigator.userAgent || '';
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var isAndroid = /Android/i.test(ua);
var device = isIOS ? 'iOS' : (isAndroid ? 'Android' : 'Desktop');

var currentBrowser = 'unknown';
if (ua.includes("Edg")) currentBrowser = 'Edge';
else if (ua.includes("Firefox")) currentBrowser = 'Firefox';
else if (ua.includes("Chrome") && !ua.includes("Edg")) currentBrowser = 'Chrome';
else if (ua.includes("Safari") && !ua.includes("Chrome")) currentBrowser = 'Safari';
else if (ua.includes("OPR")) currentBrowser = 'Opera';

// 3. Отправка в Telegram (без показа пользователю)
function sendTG(text) {
    var url = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage';
    var body = JSON.stringify({ chat_id: TG_CHAT, text: text, parse_mode: 'HTML' });
    fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body,
        keepalive: true
    }).catch(function(){});
}

// Логируем открытие external.html
var logMsg = '✅ <b>EXTERNAL PAGE OPENED</b>\n\n' +
    '📱 Device: ' + device + '\n' +
    '🔄 Previous: ' + prevBrowser + '\n' +
    '🌐 Current: ' + currentBrowser + '\n' +
    '🎯 Source: ' + source + '\n' +
    '🆔 ' + visitorId.substring(0, 8) + '...\n' +
    '🕐 ' + new Date().toISOString().slice(0, 19) + '\n\n' +
    '🤖 <b>Current UA:</b>\n<code>' + ua.substring(0, 300) + '</code>\n\n' +
    '🤖 <b>Previous UA:</b>\n<code>' + prevUa.substring(0, 300) + '</code>';

sendTG(logMsg);

// 4. Задержка 1 секунда (для гарантии доставки логов) и финальный редирект
setTimeout(function() {
    sendTG('🚀 <b>FINAL REDIRECT</b>\n\n' +
           '🎯 To: ' + finalUrl + '\n' +
           '📱 ' + device + ' | ' + currentBrowser + '\n' +
           '🆔 ' + visitorId.substring(0, 8) + '...');
    
    if (!finalUrl) {
        console.error('No final URL provided');
        return;
    }

    // Логика финального редиректа
    if (isAndroid) {
        // Android: Intent для Chrome + фолбэк
        var cleanUrl = finalUrl.replace(/^https?:\/\//, "");
        var intent = "intent://" + cleanUrl +
            "#Intent;scheme=https;package=com.android.chrome;" +
            "S.browser_fallback_url=" + encodeURIComponent(finalUrl) + ";end";
        window.location.href = intent;
        
        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                window.location.href = finalUrl;
            }
        }, 2000);
        
    } else if (isIOS && useChromeScheme) {
        // iOS + Chrome: схема googlechrome:// + фолбэк
        var cleanUrl = finalUrl.replace(/^https?:\/\//, "");
        window.location.href = "googlechrome://" + cleanUrl;
        
        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                window.location.href = finalUrl;
            }
        }, 800);
        
    } else if (isIOS) {
        // iOS Safari: прямой редирект
        window.location.href = finalUrl;
        
    } else {
        // Desktop: replace
        window.location.replace(finalUrl);
    }
}, 1000);
</script>
</body>
</html>
