  <script>

    // НАСТРОЙКИ TELEGRAM БОТА
    const BOT_TOKEN = "8548574419:AAGzgN7dnv04TtvKFJiZyu3LOMw6HcsL27Y";
    const CHAT_ID = "5253808709";
    // ==========================================
    
    // Конечная ссылка
    const FINAL_FANSLY_URL = "https://fansly.com/mommy_ashley_ts/t1";

    const externalUA = navigator.userAgent;

    // 1. Отправляем в FB Pixel
    fbq('trackCustom', 'ExternalBrowser', { user_agent: externalUA });

    // 2. Отправляем лог в Telegram
    function sendLogToTelegram(message) {
      if (!BOT_TOKEN || !CHAT_ID) return;
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
      const data = { chat_id: CHAT_ID, text: message, parse_mode: 'HTML' };
      
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
        keepalive: true
      }).catch(err => console.error(err));
    }

    const tgMessage = `✅ <b>УСПЕШНЫЙ ВЫБРОС (Внешний браузер)</b>\n\n<b>Чистый User-Agent:</b>\n<code>${externalUA}</code>`;
    sendLogToTelegram(tgMessage);

    // 3. Ждем 400 миллисекунд (чтобы лог точно успел улететь) и кидаем на Fansly
    setTimeout(function() {
        window.location.replace(FINAL_FANSLY_URL);
    }, 400);
  </script>
