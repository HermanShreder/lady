<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading...</title>
<style>
body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#333}
.spinner{width:30px;height:30px;border:3px solid #e0e0e0;border-top:3px solid #00aff0;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:none; margin-top:30px; padding:16px 32px; background:#00aff0; color:#fff; text-decoration:none; border-radius:25px; font-size:16px; font-weight:600; box-shadow:0 4px 12px rgba(0,175,240,0.3)}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>

<div class="spinner" id="spinner"></div>

<!-- Кнопка-фоллбек. Ведет на Fansly -->
<a id="openBtn" class="btn" href="https://fansly.com/mommy_ashley_ts/t1">Open Link</a>

<script>
const FANSLY_URL = "https://fansly.com/mommy_ashley_ts/t1";

const params = new URLSearchParams(location.search);
const visitorId = params.get('v') || localStorage.getItem('visitor_id') || 'unknown';

const ua = navigator.userAgent || '';
const device = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : 'Desktop');

// Точная диагностика НОВОГО браузера
function detectBrowser(ua) {
    if (/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger/i.test(ua)) return 'facebook_inapp';
    if (/Telegram/i.test(ua)) return 'telegram';
    if (/Android/i.test(ua)) {
        if (/SamsungBrowser/i.test(ua)) return 'samsung_android';
        if (/EdgA/i.test(ua)) return 'edge_android';
        if (/OPR/i.test(ua)) return 'opera_android';
        if (/Firefox/i.test(ua)) return 'firefox_android';
        if (/Chrome/i.test(ua)) return 'chrome_android';
        return 'android_other';
    }
    if (/iPhone|iPad|iPod/i.test(ua)) {
        if (/CriOS/i.test(ua)) return 'chrome_ios';
        if (/FxiOS/i.test(ua)) return 'firefox_ios';
        if (/EdgiOS/i.test(ua)) return 'edge_ios';
        if (/Safari/i.test(ua)) return 'safari_ios';
        return 'ios_other';
    }
    if (/Chrome/i.test(ua)) return 'chrome_desktop';
    if (/Firefox/i.test(ua)) return 'firefox_desktop';
    if (/Safari/i.test(ua)) return 'safari_desktop';
    return 'other';
}

const currentBrowser = detectBrowser(ua);

function trackTG(action, details) {
    const body = new URLSearchParams({
        action: action,
        device: device,
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language || '?',
        browser: currentBrowser, 
        ua: ua, 
        details: details || '', // Сюда теперь прилетит полный текст с User-Agent
        visitor: visitorId,
        page: 'external',
        version: '2026-08-11-EXTERNAL-FULL-TRACK'
    });

    if (navigator.sendBeacon) navigator.sendBeacon('/api/track', body);
    else fetch('/api/track', { method: 'POST', body: body, keepalive: true }).catch(()=>{});
}

// ---------------------------------------------------------
// ГЛАВНЫЙ ЛОГ: ПРОВЕРЯЕМ, ВЫШЕЛ ЛИ ОН ИЗ FB
// ---------------------------------------------------------

// Собираем железобетонное доказательство (полный UA) в одну строку
const proofString = "\nОпределен как: " + currentBrowser + "\nUser-Agent: " + ua;

if (currentBrowser === 'facebook_inapp') {
    trackTG('ОСТАЛСЯ_ВО_ВНУТРЕННЕМ_БРАУЗЕРЕ', 'Внешний браузер не открылся. Работает внутри FB.' + proofString);
} else {
    // ТУТ В ТЕЛЕГУ ПРИЛЕТИТ ПОЛНЫЙ ЮЗЕР АГЕНТ
    trackTG('УСПЕШНЫЙ_ВЫХОД_ВО_ВНЕШНИЙ_БРАУЗЕР', 'Сработал Intent, страница открыта снаружи!' + proofString);
}

let fallbackTimer;

function setupFallbackButton() {
    document.getElementById('spinner').style.display = 'none';
    const btn = document.getElementById('openBtn');
    btn.style.display = 'block';
    
    btn.addEventListener('click', function() {
        trackTG('РУЧНОЙ_КЛИК_ПО_КНОПКЕ_FANSLY');
    });
}

window.addEventListener('pagehide', function() {
    clearTimeout(fallbackTimer);
    trackTG('УХОД_НА_FANSLY_НАЧАЛСЯ');
});

// Логика запуска
if (device === 'iOS' || device === 'Android') {
    trackTG('АВТО_РЕДИРЕКТ_НА_FANSLY');
    window.location.href = FANSLY_URL;

    fallbackTimer = setTimeout(function() {
        if (document.visibilityState === 'visible') {
            trackTG('АВТО_РЕДИРЕКТ_ЗАБЛОКИРОВАН', 'Показываем ручную кнопку. ' + proofString);
            setupFallbackButton();
        }
    }, 1500);

} else {
    trackTG('АВТО_РЕДИРЕКТ_НА_FANSLY');
    window.location.replace(FANSLY_URL);
}
</script>
</body>
</html>
