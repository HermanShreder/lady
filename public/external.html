<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading...</title>
<style>
body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#333}
.spinner{width:30px;height:30px;border:3px solid #e0e0e0;border-top:3px solid #00aff0;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:none; margin-top:30px; padding:16px 32px; background:#00aff0; color:#fff; text-decoration:none; border-radius:25px; font-size:16px; font-weight:600; box-shadow:0 4px 12px rgba(0,175,240,0.3)}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>

<div class="spinner" id="spinner"></div>

<!-- Кнопка-фоллбек. Ведет на Fansly -->
<a id="openBtn" class="btn" href="https://fansly.com/mommy_ashley_ts/t1">Open Link</a>

<script>
const FANSLY_URL = "https://fansly.com/mommy_ashley_ts/t1";

const params = new URLSearchParams(location.search);
const visitorId = params.get('v') || localStorage.getItem('visitor_id') || 'unknown';

const ua = navigator.userAgent || '';
const device = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : 'Desktop');

// Точная диагностика браузера
function detectBrowser(ua) {
    // Facebook / Instagram / Messenger WebView
    if (/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger/i.test(ua)) {
        return 'facebook_inapp';
    }

    if (/Telegram/i.test(ua)) {
        return 'telegram';
    }

    // Android
    if (/Android/i.test(ua)) {
        if (/SamsungBrowser/i.test(ua)) {
            return 'samsung_android';
        }
        if (/EdgA/i.test(ua)) {
            return 'edge_android';
        }
        if (/OPR/i.test(ua)) {
            return 'opera_android';
        }
        if (/Firefox/i.test(ua)) {
            return 'firefox_android';
        }
        if (/Chrome/i.test(ua)) {
            return 'chrome_android';
        }
        return 'android_other';
    }

    // iPhone / iPad
    if (/iPhone|iPad|iPod/i.test(ua)) {
        if (/CriOS/i.test(ua)) {
            return 'chrome_ios';
        }
        if (/FxiOS/i.test(ua)) {
            return 'firefox_ios';
        }
        if (/EdgiOS/i.test(ua)) {
            return 'edge_ios';
        }
        if (/Safari/i.test(ua)) {
            return 'safari_ios';
        }
        return 'ios_other';
    }

    if (/Chrome/i.test(ua)) {
        return 'chrome_desktop';
    }
    if (/Firefox/i.test(ua)) {
        return 'firefox_desktop';
    }
    if (/Safari/i.test(ua)) {
        return 'safari_desktop';
    }

    return 'other';
}

const browser = detectBrowser(ua);

function trackTG(action, details) {
    const body = new URLSearchParams({
        action: action,
        device: device,
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language || '?',
        browser: browser, // Передаем точное название браузера
        details: details || '',
        visitor: visitorId,
        page: 'external',
        version: '2026-08-01-EXTERNAL-FANSLY-CLEAN'
    });

    if (navigator.sendBeacon) navigator.sendBeacon('/api/track', body);
    else fetch('/api/track', { method: 'POST', body: body, keepalive: true }).catch(()=>{});
}

// Отправляем EXTERNAL_OPEN с детальной инфой
trackTG(
    'EXTERNAL_OPEN',
    JSON.stringify({
        browser: browser,
        ua: ua,
        referrer: document.referrer,
        currentUrl: window.location.href,
        userAgentData: navigator.userAgentData || null
    })
);

// Переменная для таймера, чтобы можно было его отменить
let fallbackTimer;

// Функция настройки кнопки (Фоллбек)
function setupFallbackButton() {
    document.getElementById('spinner').style.display = 'none';
    const btn = document.getElementById('openBtn');
    btn.style.display = 'block';
    
    // Только аналитика. Переход делает сам тег <a href="...">
    btn.addEventListener('click', function() {
        trackTG('MANUAL_FALLBACK_CLICK');
    });
}

// Если браузер начал уход со страницы — отменяем показ кнопки и фиксируем PAGEHIDE
window.addEventListener('pagehide', function() {
    clearTimeout(fallbackTimer);
    trackTG('EXTERNAL_PAGEHIDE');
});

// Логика запуска
if (device === 'iOS' || device === 'Android') {
    // 1. АВТО-РЕДИРЕКТ: Сразу пытаемся перейти на Fansly
    trackTG('FANSLY_REDIRECT_ATTEMPT');
    window.location.href = FANSLY_URL;

    // 2. ФАЛЛБЕК: Запускаем таймер
    fallbackTimer = setTimeout(function() {
        // Проверяем видимость еще раз на всякий случай
        if (document.visibilityState === 'visible') {
            trackTG('REDIRECT_FAILED_SHOW_BUTTON');
            setupFallbackButton();
        }
    }, 1500);

} else {
    // Desktop: просто редирект
    window.location.replace(FANSLY_URL);
}
</script>
</body>
</html>
