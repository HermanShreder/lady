<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Continue</title>

<!-- Meta Pixel Code (ИСПРАВЛЕННЫЙ) -->
<script>
!function(f,b,e,v,n,t,s){
if(f.fbq)return;
n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;
n.push=n;
n.loaded=!0;
n.version='2.0';
n.queue=[];
t=b.createElement(e);
t.async=!0;
t.src=v;
s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s);
}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

fbq('init', '2127136807835684');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1575630377491379&ev=PageView&noscript=1"
/></noscript>
<!-- End Meta Pixel Code -->

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fff;color:#333;text-align:center;padding:20px}
.title{font-size:18px;font-weight:600;margin-bottom:24px;color:#333}
.btn{display:inline-block;padding:16px 32px;background:#00aff0;color:#fff;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 12px rgba(0,175,240,0.3);transition:transform 0.1s}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>

<div class="title">Tap to continue in browser</div>
<a id="openBtn" class="btn" href="#">Open in Browser</a>

<script>
let visitorId = localStorage.getItem('visitor_id');
if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem('visitor_id', visitorId);
}

const VERSION = '2026-08-06-BRIDGE-ESCAPE-FIXED';
const EXTERNAL_PAGE_URL = '/external.html'; 

// --- ОПРЕДЕЛЕНИЕ ОКРУЖЕНИЯ ---
const ua = navigator.userAgent || '';
const device = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : 'Desktop');

let browserType = 'unknown';
let isFB = false;

if (/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|wv/i.test(ua)) {
    isFB = true;
    browserType = 'facebook_inapp';
}

if (navigator.userAgentData && navigator.userAgentData.brands) {
    const brands = navigator.userAgentData.brands;
    if (brands.some(b => b.brand === "Android WebView")) {
        isFB = true;
        browserType = 'android_webview';
    } else if (brands.some(b => b.brand === "Google Chrome" || b.brand === "Chromium")) {
        browserType = 'chrome';
    } else if (brands.some(b => b.brand === "Safari")) {
        browserType = 'safari';
    }
} else {
    if (/CriOS|Chrome/i.test(ua)) browserType = 'chrome';
    else if (/Safari/i.test(ua)) browserType = 'safari';
}

const envData = {
    ua: ua,
    brands: navigator.userAgentData ? navigator.userAgentData.brands : null,
    platform: navigator.platform,
    language: navigator.language,
    referrer: document.referrer,
    screen: `${screen.width}x${screen.height}`,
    isFB: isFB,
    determinedBrowser: browserType
};

// --- ЛОГИРОВАНИЕ ---
function trackTG(action, extraDetails = {}) {
    const finalDetails = JSON.stringify({ ...envData, ...extraDetails });
    
    var d = new URLSearchParams({
        action: action,
        device: device,
        details: finalDetails,          
        screen: envData.screen,         
        lang: navigator.language || '?',
        visitor: visitorId,
        page: 'bridge_escape',
        version: VERSION,
        browser: browserType            
    });

    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', d);
    } else {
        fetch('/api/track', { method: 'POST', body: d, keepalive: true }).catch(function(){});
    }
}

trackTG('BRIDGE_OPEN');

// --- ЛОГИКА ВЫБРОСА ---
function executeRedirect() {
    trackTG('REDIRECT_TRIGGERED');

    if (device === 'Android') {
        if (isFB) {
            trackTG('ANDROID_FB_INTENT_ESCAPE');
            
            const intent = "intent://" + 
                EXTERNAL_PAGE_URL.replace(/^\/?/, "") + 
                "#Intent;scheme=https;package=com.android.chrome;" +
                "S.browser_fallback_url=" + encodeURIComponent(window.location.origin + EXTERNAL_PAGE_URL) + ";end";
            
            window.location.href = intent;

            setTimeout(function() {
                if (document.visibilityState === 'visible') {
                    trackTG('INTENT_FAILED_FALLBACK_WEB');
                    window.location.href = EXTERNAL_PAGE_URL;
                }
            }, 2000);

        } else {
            trackTG('ANDROID_EXTERNAL_REDIRECT');
            window.location.href = EXTERNAL_PAGE_URL;
        }

    } else if (device === 'iOS') {
        trackTG('IOS_ESCAPE_ATTEMPT');
        window.location.href = EXTERNAL_PAGE_URL;
        
        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                trackTG('IOS_ESCAPE_FAILED_RETRY');
                window.location.href = EXTERNAL_PAGE_URL;
            }
        }, 1500);

    } else {
        trackTG('DESKTOP_WEB_REDIRECT');
        window.location.replace(EXTERNAL_PAGE_URL);
    }
}

// --- ОБРАБОТКА КЛИКА С ЗАДЕРЖКОЙ ДЛЯ ПИКСЕЛЯ ---
document.getElementById('openBtn').addEventListener('click', function(e) {
    e.preventDefault(); 
    
    // Отправляем событие Lead
    if (typeof fbq === 'function') {
        fbq('track', 'Lead', { content_name: 'bridge_escape_click' });
    }
    
    trackTG('MANUAL_CLICK_REDIRECT', { clickSource: 'main_button' });
    
    // ⚡ ВАЖНО: Даем 300мс на отправку данных в Meta перед редиректом
    setTimeout(function() {
        executeRedirect();
    }, 300);
});
</script>
</body>
</html>
