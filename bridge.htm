<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Open Telegram</title>

<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=true;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window,document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init','2127136807835684');
fbq('track', 'PageView');
</script>
<!-- End Meta Pixel Code -->

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fff;color:#333;text-align:center;padding:20px}
.title{font-size:18px;font-weight:600;margin-bottom:24px;color:#333}
.btn{display:inline-block;padding:16px 32px;background:#00aff0;color:#fff;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 12px rgba(0,175,240,0.3);transition:transform 0.1s}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>

<div class="title">Tap the button to continue</div>

<!-- Нативная ссылка. Браузер сам обработает переход (Universal Link / App Link) -->
<a id="openBtn" class="btn" href="https://t.me/MilaNoirOF">Open Telegram</a>

<script>
// 1. Управление ID посетителя
let visitorId = localStorage.getItem('visitor_id');
if (!visitorId) {
    visitorId = (typeof crypto !== 'undefined' && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v-' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem('visitor_id', visitorId);
}

const VERSION = '2026-07-31-DIRECT';
// Если используете трекер, замените эту ссылку на ссылку трекера
const TG_URL = "https://t.me/MilaNoirOF"; 

// Гарантируем, что у кнопки правильный href
document.getElementById('openBtn').href = TG_URL;

var ua = navigator.userAgent || '';
var device = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : 'Desktop');
var isFB = ua.includes("FBAN") || ua.includes("FBAV") || ua.includes("FB_IAB") || ua.includes("FBIOS") || ua.includes("Instagram") || ua.includes("Messenger");

// 2. Функция отправки аналитики
function trackTG(action, details) {
    var d = new URLSearchParams({
        action: action,
        device: device,
        details: details || '',
        screen: screen.width + 'x' + screen.height,
        lang: navigator.language || '?',
        visitor: visitorId,
        page: 'bridge',
        version: VERSION,
        browser: isFB ? 'inapp' : 'external'
    });

    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', d);
    } else {
        fetch('/api/track', { method: 'POST', body: d, keepalive: true }).catch(function(){});
    }
}

// 3. Логируем открытие страницы и окружение сразу при загрузке
trackTG('BRIDGE_OPEN');
trackTG('BRIDGE_ENV', JSON.stringify({
    ua: navigator.userAgent,
    brands: navigator.userAgentData?.brands || null,
    vendor: navigator.vendor,
    referrer: document.referrer,
    platform: navigator.platform
}));

var leadSent = false;

// 4. Обработка клика БЕЗ preventDefault()
// Мы просто отправляем данные в фон, а браузер сам выполняет переход по href
document.getElementById('openBtn').addEventListener('click', function() {
    if (!leadSent) {
        leadSent = true;
        
        // Отправка Meta Pixel Lead
        if (typeof fbq === 'function') {
            fbq('track', 'Lead', { content_name: 'tg_bridge_direct', device: device });
        }
        
        // Отправка в нашу аналитику
        trackTG('LEAD_QUEUED');
    }
    
    trackTG('BRIDGE_MANUAL_CLICK');
    
    // Никакого e.preventDefault()
    // Никакого window.location.href = ...
    // Браузер просто переходит по ссылке, указанной в href тега <a>
});
</script>
</body>
</html>
