<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading...</title>
<style>
body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#333}
.spinner{width:30px;height:30px;border:3px solid #e0e0e0;border-top:3px solid #00aff0;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="spinner"></div>

<script>
const TG_URL = "https://t.me/MilaNoirOF";
const params = new URLSearchParams(location.search);
const visitorId = params.get('v') || localStorage.getItem('visitor_id') || 'unknown';

// 1. Сбор ВСЕХ запрошенных данных об окружении
const envData = {
    ua: navigator.userAgent,
    userAgentData: navigator.userAgentData ? {
        brands: navigator.userAgentData.brands,
        platform: navigator.userAgentData.platform,
        architecture: navigator.userAgentData.architecture,
        mobile: navigator.userAgentData.mobile
    } : null,
    vendor: navigator.vendor,
    platform: navigator.platform,
    language: navigator.language,
    languages: navigator.languages,
    maxTouchPoints: navigator.maxTouchPoints,
    webdriver: navigator.webdriver,
    referrer: document.referrer,
    currentUrl: window.location.href,
    screen: {
        width: screen.width,
        height: screen.height,
        availWidth: screen.availWidth,
        availHeight: screen.availHeight
    },
    standalone: navigator.standalone,
    cookieEnabled: navigator.cookieEnabled,
    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
};

// 2. Определение типа браузера (строго по вашему правилу)
const ua = envData.ua;
const browser = /Telegram/i.test(ua) ? "telegram" :
                /FBAN|FBAV|FB_IAB|Instagram|Messenger/i.test(ua) ? "facebook" :
                /CriOS|Chrome/i.test(ua) ? "chrome" :
                /Safari/i.test(ua) ? "safari" : "other";

// 3. Функция трекинга
function trackTG(action, details) {
    const body = new URLSearchParams({
        action: action,
        browser: browser, // Ключевое поле для диагностики!
        details: details || '',
        visitor: visitorId,
        page: 'external',
        version: '2026-07-31-EXTERNAL'
    });

    if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/track', body);
    } else {
        fetch('/api/track', { method: 'POST', body: body, keepalive: true }).catch(()=>{});
    }
}

// 4. Отправка полного дампа окружения на сервер
trackTG('EXTERNAL_PAGE_LOADED', JSON.stringify(envData));

// 5. Финальный редирект в Telegram через 500 мс
setTimeout(function() {
    trackTG('EXTERNAL_REDIRECT_START');
    // replace() не сохраняет эту страницу в истории, кнопка "Назад" будет работать корректно
    window.location.replace(TG_URL);
}, 500);
</script>
</body>
</html>
